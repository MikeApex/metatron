<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Life Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0d0d;
      color: #e8e8e8;
      /* height, not min-height. With min-height the body grows past the
         viewport, so #conversation (flex:1) expands to fit its content and
         never becomes a scroll container — the page scrolls instead. That made
         overflow-y, margin-top:auto and scrollTop on #conversation all no-ops. */
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px 20px 12px;
      font-size: 13px;
      color: #666;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-bottom: 1px solid #1a1a1a;
    }

    #conversation {
      flex: 1;
      /* A flex item will not shrink below its content size without this, so
         overflow-y would still never engage. */
      min-height: 0;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Anchor to the bottom. A flex column defaults to packing at the top, so a
       short conversation sat at the top of a tall screen and the newest message
       was the furthest from the thumb. margin-top:auto on the first child is
       used rather than justify-content:flex-end, which can make overflowing
       content unreachable at the top of a scroll container. */
    #conversation > *:first-child {
      margin-top: auto;
    }

    /* Wraps a bubble plus its meta row (timestamp, miss-tap) so the two stay
       visually attached — #conversation's 16px gap is between messages, not
       between a bubble and its own timestamp. */
    .message-row {
      display: flex;
      flex-direction: column;
      max-width: 88%;
    }

    .message-row.user { align-self: flex-end; align-items: flex-end; }
    .message-row.assistant { align-self: flex-start; align-items: flex-start; }

    .message {
      max-width: 100%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 16px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .message.user {
      background: #1e3a5f;
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      background: #1a1a1a;
      border-bottom-left-radius: 4px;
    }

    .message.system {
      background: transparent;
      color: #555;
      font-size: 13px;
      align-self: center;
      text-align: center;
    }

    /* The waiting state, shown in the assistant bubble until the first chunk of a
       reply arrives. It replaces a bare '▍' glyph, which rendered as a thin empty
       box with what looked like a stuck cursor — indistinguishable from a hung app
       across the tens of seconds a reply can take to start. Lives inside the normal
       bubble at the normal font size, so nothing reflows when text replaces it. */
    .working {
      background: linear-gradient(90deg, #5f5f5f 0%, #5f5f5f 40%, #cfcfcf 50%, #5f5f5f 60%, #5f5f5f 100%);
      background-size: 200% 100%;
      animation: working-shimmer 2.2s linear infinite;
      color: #8a8a8a;
    }

    /* The transparent fill is what makes the gradient visible as text, so it is only
       applied where the clip is actually supported — without the guard, a browser
       lacking background-clip:text would render invisible text, which is a worse
       version of the bug being fixed. */
    @supports ((-webkit-background-clip: text) or (background-clip: text)) {
      .working {
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }
    }

    /* Animating a fixed-width reveal over '...' rather than animating `content`,
       which is not reliably supported. */
    .working::after {
      content: '...';
      display: inline-block;
      width: 0;
      overflow: hidden;
      vertical-align: bottom;
      animation: working-dots 1.4s steps(4, end) infinite;
    }

    @keyframes working-shimmer {
      from { background-position: 100% 0; }
      to   { background-position: -100% 0; }
    }

    @keyframes working-dots {
      to { width: 1.1em; }
    }

    .msg-meta {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 4px;
      padding: 0 4px;
    }

    .msg-time {
      font-size: 11px;
      color: #555;
    }

    footer {
      padding: 16px 20px;
      border-top: 1px solid #1a1a1a;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #status {
      font-size: 12px;
      color: #555;
      text-align: center;
      min-height: 16px;
    }

    /* Readout of what was just heard. Dismissable: a long dictation used to grow
       the footer until it crowded the conversation off the screen. Capped height,
       scrollable inside the cap, with a close button and an auto-hide timer. The
       same text also lands in the conversation as a user message, so nothing is
       lost when it goes. */
    #transcript-wrap {
      display: none;
      align-items: flex-start;
      gap: 8px;
      background: #141414;
      border: 1px solid #262626;
      border-radius: 12px;
      padding: 8px 10px;
    }

    #transcript-wrap.shown { display: flex; }

    #transcript {
      flex: 1;
      font-size: 14px;
      color: #aaa;
      font-style: italic;
      line-height: 1.5;
      max-height: 4.5em;
      overflow-y: auto;
      overflow-wrap: anywhere;
    }

    #transcript-close {
      flex: 0 0 auto;
      background: none;
      border: none;
      color: #666;
      font-size: 15px;
      line-height: 1;
      padding: 2px 4px;
      cursor: pointer;
    }

    #transcript-close:hover { color: #aaa; }

    #controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #mic-btn {
      flex: 1;
      height: 56px;
      border: none;
      border-radius: 28px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      background: #1e3a5f;
      color: #e8e8e8;
    }

    #mic-btn.listening {
      background: #7f1d1d;
      animation: pulse 1.2s ease-in-out infinite;
    }

    #mic-btn.loading {
      background: #333;
      cursor: not-allowed;
    }

    /* Approval prompt. Deliberately the loudest thing in the footer: it is the last
       point at which an irreversible action can be stopped. */
    #confirm-bar {
      display: none;
      flex-direction: column;
      gap: 10px;
      background: #1c1608;
      border: 1px solid #6b5312;
      border-radius: 12px;
      padding: 12px 14px;
    }
    #confirm-bar.shown { display: flex; }
    #confirm-text {
      font-size: 14px;
      color: #e8dcc0;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-height: 9em;
      overflow-y: auto;
    }
    #confirm-actions { display: flex; gap: 8px; }
    #confirm-actions button {
      flex: 1;
      padding: 10px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #333;
    }
    #confirm-no  { background: #1a1a1a; color: #999; }
    #confirm-yes { background: #7a5c12; color: #fff; border-color: #7a5c12; }
    #confirm-yes:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Spoken-reply and alert toggles. They sit next to the mic rather than in the
       hidden settings row, because both are meant to be flipped mid-conversation. */
    #voice-toggle, #alert-toggle {
      width: 56px;
      height: 56px;
      flex: 0 0 auto;
      border: 1px solid #333;
      border-radius: 28px;
      background: #1a1a1a;
      color: #666;
      font-size: 20px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    #voice-toggle.on, #alert-toggle.on {
      background: #1e3a5f;
      border-color: #1e3a5f;
      color: #e8e8e8;
    }

    /* Alert settings. Collapsed by default — the toggle button carries the state,
       and this is opened only to change how alerts behave. */
    #alert-settings {
      display: none;
      flex-direction: column;
      gap: 10px;
      background: #141414;
      border: 1px solid #262626;
      border-radius: 12px;
      padding: 12px 14px;
    }
    #alert-settings.shown { display: flex; }
    .alert-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      color: #999;
    }
    .alert-row select { flex: 1; max-width: 62%; }
    .alert-check {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    .alert-check input { width: 16px; height: 16px; accent-color: #1e3a5f; }
    #alert-note { font-size: 11px; color: #444; line-height: 1.4; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    #text-input {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #compose-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #attach-btn {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      border: 1px solid #333;
      border-radius: 21px;
      background: #1a1a1a;
      color: #888;
      font-size: 18px;
      cursor: pointer;
    }
    #attach-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Files chosen but not yet sent. Hidden entirely when empty so the composer
       keeps its usual height. */
    #attach-strip {
      display: none;
      flex-wrap: wrap;
      gap: 6px;
    }
    #attach-strip.shown { display: flex; }

    .attach-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 4px 8px;
      font-size: 12px;
      color: #aaa;
      max-width: 100%;
    }
    .attach-chip.failed { border-color: #7f1d1d; color: #b98; }
    .attach-chip img {
      width: 26px;
      height: 26px;
      object-fit: cover;
      border-radius: 5px;
    }
    .attach-chip .chip-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 140px;
    }
    .attach-chip .chip-x {
      cursor: pointer;
      color: #666;
      font-size: 14px;
      line-height: 1;
      padding: 0 2px;
    }
    .attach-chip .chip-x:active { color: #aaa; }

    /* Files already sent, shown inside the message bubble they went with. */
    .msg-attachments {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .msg-attachments img {
      max-width: 190px;
      max-height: 190px;
      border-radius: 10px;
      display: block;
      cursor: zoom-in;
    }
    .attach-chip.saveable { cursor: pointer; }
    .attach-chip.saveable:active { border-color: #1e3a5f; }

    /* Full-size view of a sent image. Above the login screen (z-index 100) so it
       cannot be left stranded underneath a session expiry. */
    #lightbox {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.94);
    }
    #lightbox.shown { display: flex; }
    #lightbox img {
      max-width: 100%;
      max-height: 76vh;
      object-fit: contain;
      border-radius: 8px;
    }
    #lightbox-bar { display: flex; gap: 10px; }
    #lightbox-bar button {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 20px;
      color: #ccc;
      font-size: 14px;
      padding: 9px 20px;
      cursor: pointer;
    }
    #lightbox-name {
      font-size: 12px;
      color: #666;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #text-field {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 22px;
      padding: 10px 16px;
      font-size: 15px;
      color: #e8e8e8;
      outline: none;
    }

    #text-field:focus { border-color: #1e3a5f; }

    #send-btn {
      background: #1e3a5f;
      border: none;
      border-radius: 22px;
      padding: 10px 18px;
      font-size: 15px;
      color: #e8e8e8;
      cursor: pointer;
      width: 100%;
    }

    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #voice-unsupported {
      display: none;
      color: #666;
      font-size: 13px;
      text-align: center;
    }

    /* Settings bar */
    #settings {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 12px;
      color: #555;
    }

    select {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #888;
      padding: 4px 8px;
      font-size: 12px;
    }

    .miss-tap {
      width: 20px;
      height: 20px;
      line-height: 20px;
      text-align: center;
      font-size: 18px;
      color: #2a2a2a;
      cursor: pointer;
      border-radius: 50%;
      transition: color 0.2s, opacity 0.4s;
      user-select: none;
      -webkit-user-select: none;
    }

    .miss-tap:active { color: #444; }
    .miss-tap.sent { opacity: 0; pointer-events: none; }

    /* Login screen */
    #login-screen {
      position: fixed;
      inset: 0;
      background: #0d0d0d;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #login-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: min(320px, 90vw);
    }
    #login-icon { font-size: 72px; line-height: 1; }
    #login-title {
      font-size: 13px;
      color: #555;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    .login-row { display: flex; flex-direction: column; gap: 6px; width: 100%; }
    .login-row label { font-size: 11px; color: #444; text-transform: uppercase; letter-spacing: 0.08em; }
    .login-row select, .login-row input[type="password"] {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      color: #e8e8e8;
      padding: 12px 14px;
      font-size: 15px;
      outline: none;
    }
    /* Password field + reveal button. The button is positioned over the input rather
       than beside it, so the field keeps its full width and the login box does not
       reflow. Right padding on the input reserves the space. */
    #password-wrap { position: relative; width: 100%; }
    #password-wrap input[type="password"],
    #password-wrap input[type="text"] {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      color: #e8e8e8;
      padding: 12px 46px 12px 14px;
      font-size: 15px;
      outline: none;
    }
    #password-reveal {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      border: none;
      background: transparent;
      color: #555;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      opacity: 0.55;
      transition: opacity 0.15s;
    }
    #password-reveal.on { opacity: 1; color: #8ab; }

    #login-error {
      display: none;
      font-size: 13px;
      color: #b00020;
      text-align: center;
      width: 100%;
    }
    #login-enter-btn {
      width: 100%;
      height: 52px;
      background: #1e3a5f;
      border: none;
      border-radius: 26px;
      color: #e8e8e8;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    /* Persona chip in header */
    header { display: flex; justify-content: space-between; align-items: center; }
    #persona-chip {
      font-size: 11px;
      color: #444;
      cursor: pointer;
      padding: 3px 8px;
      border: 1px solid #222;
      border-radius: 10px;
      letter-spacing: 0.06em;
    }
    #persona-chip:active { color: #666; }
  </style>
</head>
<body>

<div id="login-screen">
  <div id="login-box">
    <div id="login-icon">𐤌</div>
    <div id="login-title">Metatron</div>
    <div class="login-row">
      <label>Persona</label>
      <select id="login-persona-select">
        <optgroup label="User">
          <option value="mike">mike</option>
        </optgroup>
        <optgroup label="Test personas">
          <option value="pepys">pepys</option>
          <option value="danny_park">danny_park</option>
          <option value="maya_torres">maya_torres</option>
          <option value="sarah_chen">sarah_chen</option>
          <option value="arthur_brooks">arthur_brooks</option>
          <option value="cal_newport">cal_newport</option>
          <option value="ryan_holiday">ryan_holiday</option>
          <option value="oliver_burkeman">oliver_burkeman</option>
          <option value="test_a3">test_a3</option>
        </optgroup>
      </select>
    </div>
    <div class="login-row">
      <label>Password</label>
      <div id="password-wrap">
        <input id="login-password" type="password" placeholder="required"
               autocapitalize="none" autocorrect="off" spellcheck="false">
        <button id="password-reveal" type="button" tabindex="-1"
                aria-label="Show password">👁</button>
      </div>
    </div>
    <div id="login-error"></div>
    <button id="login-enter-btn">Enter</button>
  </div>
</div>

<header>
  <span>Life Manager</span>
  <span id="persona-chip" style="display:none"></span>
</header>

<div id="conversation">
  <div class="message system">Session started. Tap the mic or type to begin.</div>
</div>

<footer>
  <div id="settings" style="display:none">
    <select id="provider-select"><option value="">Auto (server routing)</option></select>
    <select id="agent-select"><option value="coordinator">Coordinator</option></select>
  </div>

  <div id="status">Checking mic...</div>
  <div id="transcript-wrap">
    <div id="transcript"></div>
    <button id="transcript-close" title="Dismiss" aria-label="Dismiss transcription">✕</button>
  </div>

  <!-- Approval prompt for irreversible actions. Rendered from /pending-confirmations
       and answered by POST /confirm, so consent is recorded by the server from a real
       tap — never by the model reporting that the user agreed. -->
  <div id="confirm-bar">
    <div id="confirm-text"></div>
    <div id="confirm-actions">
      <button id="confirm-no">Not now</button>
      <button id="confirm-yes">Approve</button>
    </div>
  </div>

  <div id="controls">
    <button id="mic-btn">Tap to Speak</button>
    <button id="voice-toggle" title="Spoken replies on/off">🔇</button>
    <button id="alert-toggle" title="Alerts when a message arrives">🔔</button>
  </div>

  <div id="alert-settings">
    <div class="alert-row">
      <label for="alert-scope">Alert me</label>
      <select id="alert-scope">
        <option value="always">On every reply</option>
        <option value="hidden">Only when I'm away</option>
        <option value="proactive">Only when Metatron starts</option>
        <option value="off">Never</option>
      </select>
    </div>
    <div class="alert-row">
      <label class="alert-check"><input type="checkbox" id="alert-sound"> Sound</label>
      <label class="alert-check"><input type="checkbox" id="alert-vibrate"> Vibrate</label>
    </div>
    <div id="alert-note"></div>
  </div>
  <div id="grant-wrap" style="text-align:center;display:none">
    <button id="grant-btn" style="background:#333;border:1px solid #555;border-radius:20px;color:#aaa;font-size:13px;padding:8px 20px;cursor:pointer">Grant mic permission</button>
  </div>
  <div id="notif-wrap" style="text-align:center;margin-top:6px">
    <span id="notif-debug" style="color:#333;font-size:11px">notif-v2</span>
  </div>

  <div id="text-input">
    <div id="attach-strip"></div>
    <div id="compose-row">
      <button id="attach-btn" title="Attach a photo or document">📎</button>
      <input id="text-field" type="text" placeholder="Or type here..." autocomplete="off">
    </div>
    <button id="send-btn">Send</button>
    <!-- No `capture` attribute: with it, Android opens the camera and nothing else.
         The plain chooser offers the camera alongside the gallery and Files. -->
    <input id="attach-input" type="file" multiple style="display:none"
           accept="image/png,image/jpeg,image/webp,image/heic,image/heif,application/pdf">
  </div>

  <div id="voice-unsupported">Voice not supported in this browser. Use the text input.</div>
</footer>

<div id="lightbox">
  <img id="lightbox-img" alt="">
  <div id="lightbox-name"></div>
  <div id="lightbox-bar">
    <button id="lightbox-save">Save</button>
    <button id="lightbox-close">Close</button>
  </div>
</div>

<script>
  // Capacitor 5+ serves bundled assets from https://localhost.
  // In the browser PWA the host is the Tailscale hostname, not localhost.
  // SERVER points to the real backend when running in the Capacitor app.
  const SERVER = window.location.hostname === 'localhost' ? 'https://metatron-vm.tail0acc5d.ts.net:8001' : '';

  // Shown in the assistant bubble while a reply is being worked on, rotating every
  // few seconds. Edit freely — but keep them whimsical and empty of meaning: a word
  // here must never name a model, a stage, a tool or a sub-agent. The user sees
  // output, not process.
  const WORKING_VERBS = [
    'Pontificating', 'Ruminating', 'Finagling', 'Percolating', 'Noodling',
    'Cogitating', 'Deliberating', 'Mulling', 'Rummaging', 'Untangling',
    'Marinating', 'Wrangling', 'Conjuring', 'Perusing', 'Tinkering',
    'Puzzling', 'Divining', 'Woolgathering', 'Confabulating', 'Pondering',
    'Scheming', 'Gesticulating', 'Bamboozling', 'Harrumphing', 'Dithering',
  ];
  const WORKING_ROTATE_MS = 2500;

  // --- Persona / login ---

  let currentPersona = null;

  // The session token from /auth/login. Also set as an HttpOnly cookie, which is what
  // carries the same-origin browser; this copy is what the Android app uses, since it
  // calls the VM cross-origin from https://localhost and never receives that cookie.
  let authToken = localStorage.getItem('metatron_token') || null;

  // Every call to the server goes through here. A bare fetch() that forgot the header
  // is the failure this wrapper exists to prevent — and a 401 anywhere means the token
  // expired or the password changed, so it drops straight back to the login screen
  // rather than failing in some feature-specific way the user has to interpret.
  async function authFetch(path, options = {}) {
    const opts = { ...options, credentials: 'include' };
    opts.headers = { ...(options.headers || {}) };
    if (authToken) opts.headers['Authorization'] = 'Bearer ' + authToken;
    const res = await fetch(SERVER + path, opts);
    if (res.status === 401) {
      clearAuth();
      showLogin();
      setLoginError('Session expired — sign in again.');
      throw new Error('unauthenticated');
    }
    return res;
  }

  function clearAuth() {
    authToken = null;
    localStorage.removeItem('metatron_token');
    if (ws) { try { ws.close(); } catch (e) {} }
  }

  function setLoginError(msg) {
    const el = document.getElementById('login-error');
    el.textContent = msg || '';
    el.style.display = msg ? '' : 'none';
  }

  async function login(persona, password) {
    setLoginError('');
    const btn = document.getElementById('login-enter-btn');
    btn.disabled = true;
    try {
      const res = await fetch(SERVER + '/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ password: password || '' }),
      });
      if (!res.ok) {
        setLoginError(res.status === 401 ? 'Incorrect password.' : 'Sign-in failed.');
        return;
      }
      const data = await res.json();
      authToken = data.token;
      localStorage.setItem('metatron_token', authToken);
      enterApp(persona);
    } catch (e) {
      setLoginError('Cannot reach the server.');
    } finally {
      btn.disabled = false;
    }
  }

  function enterApp(persona) {
    currentPersona = persona;
    localStorage.setItem('metatron_persona', persona);
    document.getElementById('login-screen').style.display = 'none';
    setLoginError('');
    const chip = document.getElementById('persona-chip');
    chip.textContent = persona;
    chip.style.display = '';
    requestMicPermission();
    initPush();
    connectWebSocket(persona);
  }

  function showLogin() {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('persona-chip').style.display = 'none';
  }

  function submitLogin() {
    const persona = document.getElementById('login-persona-select').value;
    const password = document.getElementById('login-password').value;
    if (persona) login(persona, password);
  }

  // Show/hide the password. Worth having on a phone: the field is typed rarely — the
  // token lasts 30 days — so a typo is both likely and invisible, and the failure it
  // produces ("Incorrect password") looks identical to genuinely having it wrong.
  //
  // Always starts hidden on a fresh login screen; the state is not persisted, since a
  // remembered "visible" would reveal the password to whoever next opens the app.
  document.getElementById('password-reveal').addEventListener('click', () => {
    const field = document.getElementById('login-password');
    const btn = document.getElementById('password-reveal');
    const show = field.type === 'password';
    field.type = show ? 'text' : 'password';
    btn.classList.toggle('on', show);
    btn.textContent = show ? '🙈' : '👁';
    btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    field.focus();
  });

  document.getElementById('login-enter-btn').addEventListener('click', submitLogin);

  document.getElementById('login-password').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitLogin();
  });

  document.getElementById('persona-chip').addEventListener('click', showLogin);

  const conversation = document.getElementById('conversation');
  const micBtn = document.getElementById('mic-btn');
  const transcript = document.getElementById('transcript');
  const transcriptWrap = document.getElementById('transcript-wrap');
  const statusEl = document.getElementById('status');
  const textField = document.getElementById('text-field');
  const sendBtn = document.getElementById('send-btn');
  const providerSelect = document.getElementById('provider-select');
  const agentSelect = document.getElementById('agent-select');
  const voiceUnsupported = document.getElementById('voice-unsupported');

  function setStatus(msg, color) {
    statusEl.textContent = msg;
    statusEl.style.color = color || '#555';
  }

  // --- Transcription readout ---

  const TRANSCRIPT_TIMEOUT_MS = 12000;
  let transcriptTimer = null;

  function showTranscript(text) {
    clearTimeout(transcriptTimer);
    transcript.textContent = text;
    transcript.scrollTop = 0;
    transcriptWrap.classList.add('shown');
    transcriptTimer = setTimeout(hideTranscript, TRANSCRIPT_TIMEOUT_MS);
  }

  function hideTranscript() {
    clearTimeout(transcriptTimer);
    transcriptTimer = null;
    transcriptWrap.classList.remove('shown');
    transcript.textContent = '';
  }

  document.getElementById('transcript-close').addEventListener('click', hideTranscript);

  // --- Conversation history display ---

  function formatTime(ts) {
    const d = ts ? new Date(ts) : new Date();
    return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }

  // ts is optional and only known for messages replayed from the server
  // (history/catchup/message). Freshly typed or streaming bubbles have none
  // yet, so they stamp with the client's current time instead.
  function addMessage(role, text, ts, attachments) {
    if (role === 'system') {
      const div = document.createElement('div');
      div.className = 'message system';
      div.textContent = text;
      conversation.appendChild(div);
      scrollToBottom();
      return div;
    }

    const row = document.createElement('div');
    row.className = `message-row ${role}`;

    const bubble = document.createElement('div');
    bubble.className = `message ${role}`;
    bubble.textContent = text;
    // Only ever on a user bubble, which is never streamed — an assistant bubble has
    // its textContent overwritten on every chunk, which would strip child nodes.
    if (attachments && attachments.length) renderMessageAttachments(bubble, attachments);
    row.appendChild(bubble);

    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    const time = document.createElement('span');
    time.className = 'msg-time';
    time.textContent = formatTime(ts);
    meta.appendChild(time);

    if (role === 'assistant') {
      const tap = document.createElement('span');
      tap.className = 'miss-tap';
      tap.textContent = '·';
      tap.title = '';
      tap.addEventListener('click', () => {
        tap.classList.add('sent');
        authFetch('/feedback', { method: 'POST' }).catch(() => {});
      });
      meta.appendChild(tap);
    }

    row.appendChild(meta);
    conversation.appendChild(row);

    scrollToBottom();
    return bubble;
  }

  // --- Attachments ---
  //
  // Upload and send are separate steps: the file goes over HTTP to /upload, which
  // returns an id, and only the id travels in the WebSocket `send` frame. Putting
  // megabytes of base64 into a socket frame would stall every other frame on that
  // connection, including the heartbeat the reconnect logic reads as liveness.
  //
  // The limits here are a courtesy copy of the server's — they exist to fail fast
  // and say why, not to be trusted. core/attachments.py is what actually decides,
  // and it sniffs the bytes rather than believing the browser's Content-Type.

  const ATTACH_MAX_BYTES = 10 * 1024 * 1024;
  const ATTACH_MAX_FILES = 4;

  // {key, name, size, status: 'uploading' | 'ready' | 'failed', record, thumb}
  let attachSlots = [];

  function readyAttachments() {
    return attachSlots.filter(s => s.status === 'ready').map(s => s.record);
  }

  function uploadsPending() {
    return attachSlots.some(s => s.status === 'uploading');
  }

  function clearAttachments() {
    for (const slot of attachSlots) {
      if (slot.thumb) URL.revokeObjectURL(slot.thumb);
    }
    attachSlots = [];
    renderAttachStrip();
  }

  function renderAttachStrip() {
    const strip = document.getElementById('attach-strip');
    strip.innerHTML = '';
    strip.classList.toggle('shown', attachSlots.length > 0);

    for (const slot of attachSlots) {
      const chip = document.createElement('div');
      chip.className = 'attach-chip' + (slot.status === 'failed' ? ' failed' : '');

      if (slot.thumb) {
        const img = document.createElement('img');
        img.src = slot.thumb;      // the local File, so no round trip to see it
        img.alt = '';
        chip.appendChild(img);
      }

      const name = document.createElement('span');
      name.className = 'chip-name';
      name.textContent =
        slot.status === 'uploading' ? `${slot.name} …`
        : slot.status === 'failed' ? `${slot.name} — ${slot.error || 'failed'}`
        : slot.name;
      chip.appendChild(name);

      const x = document.createElement('span');
      x.className = 'chip-x';
      x.textContent = '✕';
      x.title = 'Remove';
      x.addEventListener('click', () => {
        if (slot.thumb) URL.revokeObjectURL(slot.thumb);
        attachSlots = attachSlots.filter(s => s !== slot);
        renderAttachStrip();
      });
      chip.appendChild(x);

      strip.appendChild(chip);
    }
    document.getElementById('attach-btn').disabled = attachSlots.length >= ATTACH_MAX_FILES;
  }

  async function uploadOne(slot, file) {
    const fd = new FormData();
    fd.append('file', file, file.name || 'upload');
    const url = '/upload' + (currentPersona ? '?persona=' + encodeURIComponent(currentPersona) : '');
    try {
      const res = await authFetch(url, { method: 'POST', body: fd });
      if (!res.ok) {
        let detail = 'could not be sent';
        try { detail = (await res.json()).detail || detail; } catch {}
        throw new Error(detail);
      }
      slot.record = await res.json();
      slot.status = 'ready';
    } catch (e) {
      slot.status = 'failed';
      slot.error = e.message || 'could not be sent';
    }
    renderAttachStrip();
  }

  function addFiles(fileList) {
    for (const file of fileList) {
      if (attachSlots.length >= ATTACH_MAX_FILES) {
        setStatus(`Up to ${ATTACH_MAX_FILES} files at a time`, '#a44');
        break;
      }
      if (file.size > ATTACH_MAX_BYTES) {
        setStatus(`${file.name} is larger than 10 MB`, '#a44');
        continue;
      }
      const slot = {
        key: `${Date.now()}-${Math.random()}`,
        name: file.name || 'file',
        size: file.size,
        status: 'uploading',
        thumb: file.type && file.type.startsWith('image/') ? URL.createObjectURL(file) : null,
      };
      attachSlots.push(slot);
      uploadOne(slot, file);
    }
    renderAttachStrip();
  }

  document.getElementById('attach-btn').addEventListener('click', () => {
    document.getElementById('attach-input').click();
  });

  document.getElementById('attach-input').addEventListener('change', (e) => {
    addFiles(e.target.files);
    // Cleared so that choosing the same file twice in a row still fires `change`.
    e.target.value = '';
  });

  // A stored file cannot be shown with a bare <img src>: an image request carries no
  // Authorization header, and the Android app is cross-origin so it has no cookie
  // either — the same constraint that makes the WebSocket authenticate in-band.
  // Fetch it as a blob instead and hand the tag an object URL.
  const attachmentUrls = new Map();   // attachment id → object URL

  async function attachmentUrl(id) {
    if (attachmentUrls.has(id)) return attachmentUrls.get(id);
    const url = '/attachments/' + encodeURIComponent(id)
              + (currentPersona ? '?persona=' + encodeURIComponent(currentPersona) : '');
    const res = await authFetch(url);
    if (!res.ok) throw new Error('unavailable');
    const objectUrl = URL.createObjectURL(await res.blob());
    attachmentUrls.set(id, objectUrl);
    return objectUrl;
  }

  // Saving a file back out of the conversation.
  //
  // The blob is already in hand from attachmentUrl(), so this is just handing the
  // browser an anchor to act on. **Known limit: this does nothing in the Android
  // app.** A WebView has no download manager, so a `blob:` URL with a `download`
  // attribute fails silently there — open the PWA in Chrome to save a file from the
  // phone. Fixing that properly needs @capacitor/filesystem + @capacitor/share, which
  // would be the first plugins in this app; filed as [DB-0820-02] rather than
  // smuggled in behind a convenience feature.
  async function saveAttachment(a) {
    try {
      const url = await attachmentUrl(a.id);
      const link = document.createElement('a');
      link.href = url;
      link.download = a.name || 'file';
      document.body.appendChild(link);
      link.click();
      link.remove();
    } catch {
      setStatus('That file could not be opened', '#a44');
    }
  }

  let lightboxItem = null;

  function openLightbox(a, src) {
    lightboxItem = a;
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox-name').textContent = a.name || '';
    document.getElementById('lightbox').classList.add('shown');
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('shown');
    // The src is left in place: it is an object URL already cached by
    // attachmentUrl, so clearing it would only cause a re-decode on the next open.
    lightboxItem = null;
  }

  document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
  document.getElementById('lightbox-save').addEventListener('click', () => {
    if (lightboxItem) saveAttachment(lightboxItem);
  });
  // Tapping the backdrop closes; tapping the image itself must not.
  document.getElementById('lightbox').addEventListener('click', (e) => {
    if (e.target.id === 'lightbox') closeLightbox();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeLightbox();
  });

  function fileChip(a) {
    const chip = document.createElement('span');
    chip.className = 'attach-chip saveable';
    chip.textContent = (a.mime === 'application/pdf' ? '📄 ' : '📎 ') + (a.name || 'file');
    chip.title = 'Save this file';
    chip.addEventListener('click', () => saveAttachment(a));
    return chip;
  }

  function renderMessageAttachments(bubble, attachments) {
    const wrap = document.createElement('div');
    wrap.className = 'msg-attachments';
    for (const a of attachments) {
      if (a.mime && a.mime.startsWith('image/')) {
        const img = document.createElement('img');
        img.alt = a.name || '';
        img.title = a.name || '';
        wrap.appendChild(img);
        attachmentUrl(a.id)
          .then(u => {
            img.src = u;
            // A 190px thumbnail is enough to recognise a photo and not enough to
            // read anything in it, so the tap target is the whole point.
            img.addEventListener('click', () => openLightbox(a, u));
            scrollToBottom();
          })
          // A file that has been deleted underneath the conversation degrades to its
          // name rather than a broken-image icon.
          .catch(() => img.replaceWith(fileChip(a)));
      } else {
        wrap.appendChild(fileChip(a));
      }
    }
    bubble.appendChild(wrap);
  }

  // --- Waiting indicator ---
  //
  // A reply can take tens of seconds to begin — the wait is dominated by thinking,
  // not by delivery, so streaming does not shorten it (ROADMAP § 5A). Until this,
  // the bubble held a single '▍' with no animation, which read as a stuck cursor
  // in an empty box rather than as work in progress.
  //
  // The rotation timer is stored on the element rather than in a module-level map,
  // so a bubble that is discarded (renderHistory wiping the conversation, a
  // superseded socket's foreign bubble) cannot leave a timer writing to a node
  // that is no longer in the document.

  function startWorking(bubble) {
    if (!bubble) return;
    stopWorking(bubble);

    const span = document.createElement('span');
    span.className = 'working';

    let last = -1;
    const pick = () => {
      // Never draw the same word twice running: a "rotation" that changes nothing
      // is indistinguishable from a frozen one, which is the bug being fixed.
      let i = Math.floor(Math.random() * WORKING_VERBS.length);
      if (i === last) i = (i + 1) % WORKING_VERBS.length;
      last = i;
      span.textContent = WORKING_VERBS[i];
    };

    pick();
    bubble.textContent = '';
    bubble.appendChild(span);
    bubble._workingTimer = setInterval(pick, WORKING_ROTATE_MS);
  }

  // Must be called before any code that overwrites the bubble's text: assigning
  // textContent destroys the span but leaves the interval running against it.
  function stopWorking(bubble) {
    if (!bubble || !bubble._workingTimer) return;
    clearInterval(bubble._workingTimer);
    bubble._workingTimer = null;
  }

  // Auto-scroll unless the user has deliberately scrolled up to read. Yanking
  // them back down mid-read is worse than a missed scroll.
  const SCROLL_ANCHOR_SLACK = 120;

  function nearBottom() {
    const gap = conversation.scrollHeight - conversation.scrollTop - conversation.clientHeight;
    return gap <= SCROLL_ANCHOR_SLACK;
  }

  function scrollToBottom(force = false) {
    if (!force && !nearBottom()) return;
    requestAnimationFrame(() => {
      conversation.scrollTop = conversation.scrollHeight;
    });
  }

  // --- WebSocket (cross-device sync) ---

  let ws = null;
  // Set when the server closes a socket for bad credentials, so onclose knows not to
  // start the reconnect loop.
  let wsAuthFailed = false;
  let ownBubble = null;
  let ownAccumulated = '';
  const foreignBubbles = new Map();  // exchange_id → {bubble, accumulated}
  const shownIds = new Set();        // exchange_ids rendered on this device
  let lastSeenId = 0;

  // Insertion order == "oldest first" for a Set, so drop only the overflow
  // instead of wiping the whole set — a full clear() re-admits every
  // already-rendered exchange as "unseen" on the next catch-up message.
  function evictOldest(set, max) {
    while (set.size > max) set.delete(set.values().next().value);
  }

  // The server pings every 30s. If we have heard nothing for appreciably longer
  // than that, the socket is dead even if the browser still says OPEN — which is
  // exactly what happens when Android freezes the WebView: the connection dies
  // half-open, onclose never fires, and sends vanish silently with no error.
  // That silence is what reads as "Tailscale dropped".
  let lastMessageAt = 0;
  let reconnectTimer = null;
  const STALE_AFTER_MS = 45000;

  // Set while we are waiting for a doomed socket's `close` before opening its
  // replacement. Every entry point into ensureConnected (focus, online,
  // visibilitychange, the 20s interval) must respect it or the wait is pointless.
  let closePending = false;

  // How long we wait for that `close` before giving up and connecting anyway.
  // A close handshake is tens of milliseconds, and close() on an already-dead
  // socket transitions locally without the peer, so this only fires on a socket
  // that has stopped emitting events at all. It sits below the 3000ms passive
  // reconnect delay (so a deliberate reconnect is never the slower path) and well
  // below the 20000ms ensureConnected interval (so waits cannot stack).
  const CLOSE_WAIT_MS = 1500;

  function socketUsable() {
    return ws && ws.readyState === WebSocket.OPEN &&
           (Date.now() - lastMessageAt) < STALE_AFTER_MS;
  }

  function scheduleReconnect(delay = 3000) {
    if (reconnectTimer) return;          // one pending attempt at a time
    reconnectTimer = setTimeout(() => {
      reconnectTimer = null;
      if (currentPersona) connectWebSocket(currentPersona);
    }, delay);
  }

  // Replace the current socket, waiting for the old one to ACTUALLY close first.
  //
  // WebSocket.close() is asynchronous. The previous version called close() and
  // connectWebSocket() on consecutive lines, so between them both sockets were live
  // — and the server's ConnectionManager keeps a *set* of sockets per persona and
  // broadcasts to all of them, so a streaming chunk arrived twice on one device and
  // rendered twice in one bubble. Observed live twice on 2026-08-10.
  //
  // Not fixed server-side by refusing a second connection per persona: two live
  // sockets is the supported multi-device case (phone + browser), deliberate and
  // commented as such in core/server.py. The race is a client-side sequencing bug,
  // so the fix stays client-side.
  function ensureConnected() {
    if (!currentPersona) return;
    if (closePending) return;
    if (ws && ws.readyState === WebSocket.CONNECTING) return;
    if (socketUsable()) return;
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }

    const dying = ws;
    // Detached before close() resolves, so anything still arriving on it is
    // recognisable as superseded (see the `sock !== ws` guards below) and so
    // socketUsable() cannot report the corpse as live.
    ws = null;

    if (!dying || dying.readyState === WebSocket.CLOSED) {
      connectWebSocket(currentPersona);
      return;
    }

    closePending = true;
    let proceeded = false;
    const proceed = () => {
      if (proceeded) return;
      proceeded = true;
      clearTimeout(waitTimer);
      closePending = false;
      if (currentPersona) connectWebSocket(currentPersona);
    };
    // The regression this guards: a close event that never fires (Android WebViews
    // do exactly this on a half-open socket) must not strand the client offline
    // forever. Waiting is the fix; waiting unboundedly would be a worse bug.
    const waitTimer = setTimeout(proceed, CLOSE_WAIT_MS);
    dying.addEventListener('close', proceed);
    // Closing a half-open socket is what finally makes onclose fire.
    try { dying.close(); } catch (e) { proceed(); }
  }

  function connectWebSocket(persona) {
    const base = SERVER || window.location.origin;
    const wsUrl = base.replace(/^http/, 'ws') + '/ws?persona=' + encodeURIComponent(persona);
    // Every handler below closes over `sock`, never the module-level `ws`, and
    // no-ops unless it is still the active socket. Without this a superseded
    // socket's late frames would render into the live conversation — the second
    // half of the duplicate-text bug — and its onerror/onclose would act on
    // whichever socket happened to be current by then.
    const sock = new WebSocket(wsUrl);
    ws = sock;
    lastMessageAt = Date.now();

    sock.onopen = () => {
      if (sock !== ws) { try { sock.close(); } catch (e) {} return; }
      lastMessageAt = Date.now();
      setStatus('Connecting...', '#888');
      // The server requires the first frame to be an auth frame — a WebSocket cannot
      // carry an Authorization header, and a ?token= in the URL would land in the
      // access log. Nothing else is sent until the server answers auth_ok.
      sock.send(JSON.stringify({ type: 'auth', token: authToken }));
    };

    sock.onmessage = (event) => {
      if (sock !== ws) return;   // superseded socket: render nothing
      lastMessageAt = Date.now();
      const msg = JSON.parse(event.data);

      if (msg.type === 'auth_ok') {
        setStatus('Ready', '#555');
        if (lastSeenId > 0) {
          sock.send(JSON.stringify({ type: 'catchup', since_id: lastSeenId }));
        }
        return;
      }
      if (msg.type === 'auth_failed') {
        // Do not reconnect: the token is bad and retrying would loop.
        wsAuthFailed = true;
        clearAuth();
        showLogin();
        setLoginError('Session expired — sign in again.');
        return;
      }

      handleWsMessage(msg);
    };

    sock.onerror = () => {
      // An error does not reliably produce a close on mobile WebViews. Force it
      // so the reconnect path runs instead of the socket sitting there dead.
      try { sock.close(); } catch (e) {}
    };

    sock.onclose = () => {
      const current = (sock === ws);
      // Finalize an in-flight response only if this socket was the one carrying it:
      // either it is still active, or nothing has replaced it yet (the window in
      // which ensureConnected has detached it and is waiting for this very event).
      if ((current || ws === null) && ownBubble) {
        stopWorking(ownBubble);
        ownBubble.textContent = ownAccumulated || '[Connection lost]';
        ownBubble = null; ownAccumulated = '';
        setLoading(false);
      }
      // A socket already replaced must not touch the status line or start a
      // reconnect — the live socket is the one that owns both.
      if (!current) return;
      // A socket the server closed for bad credentials must not be retried — the
      // token will still be bad, and the reconnect loop would hammer the server
      // while showing the user nothing but "Reconnecting...".
      if (wsAuthFailed) {
        wsAuthFailed = false;
        setStatus('Signed out', '#888');
        return;
      }
      setStatus('Reconnecting...', '#888');
      scheduleReconnect(3000);
    };
  }

  // Android freezes the WebView when the app is backgrounded, so the socket is
  // usually already dead by the time the user returns. Check on resume rather
  // than waiting for a close event that will never arrive.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') ensureConnected();
  });
  window.addEventListener('focus', ensureConnected);
  window.addEventListener('online', ensureConnected);

  // Backstop for the case where the app stays open but the network drops out
  // underneath it — no event fires at all there. Deliberately NOT gated on
  // visibilityState: a hidden tab's socket can die the same silent half-open
  // way a foreground one can, and gating this meant the staleness check
  // never ran while the tab was in the background — so returning to it
  // relied entirely on the `visibilitychange` handler firing fresh, with no
  // catch-up in between. This is the one place that must stay unconditional.
  setInterval(ensureConnected, 20000);

  function handleWsMessage(msg) {
    switch (msg.type) {

      case 'ping':
        // Server heartbeat. lastMessageAt is already updated in onmessage;
        // this exists so the liveness contract is explicit rather than
        // depending on an unhandled case falling through.
        break;

      case 'history': {
        renderHistory(msg.messages);
        if (msg.last_id) lastSeenId = msg.last_id;
        break;
      }

      case 'stream_start': {
        // Another device started sending — render their user bubble + empty assistant bubble.
        // A proactive exchange has no user turn: Metatron opened it.
        if (!shownIds.has(msg.exchange_id)) {
          if (!msg.proactive) addMessage('user', msg.user, null, msg.attachments);
          const bubble = addMessage('assistant', '');
          startWorking(bubble);
          // proactive is carried so the alert at 'done' knows whether Metatron
          // opened this exchange — 'done' itself does not say.
          foreignBubbles.set(msg.exchange_id, { bubble, accumulated: '', proactive: !!msg.proactive });
        }
        break;
      }

      case 'chunk': {
        if (shownIds.has(msg.exchange_id)) {
          // Own exchange: update streaming bubble
          if (ownBubble) {
            stopWorking(ownBubble);
            ownAccumulated += msg.text;
            ownBubble.textContent = ownAccumulated + '▍';
            scrollToBottom();
          }
        } else {
          // Foreign exchange: update their bubble
          const fb = foreignBubbles.get(msg.exchange_id);
          if (fb) {
            stopWorking(fb.bubble);
            fb.accumulated += msg.text;
            fb.bubble.textContent = fb.accumulated + '▍';
            scrollToBottom();
          }
        }
        break;
      }

      case 'done': {
        if (shownIds.has(msg.exchange_id)) {
          // Own exchange complete — finalize and speak
          if (ownBubble) {
            stopWorking(ownBubble);
            ownBubble.textContent = ownAccumulated;
            speakResponse(ownAccumulated);
            ownBubble = null; ownAccumulated = '';
          }
          setLoading(false);
          maybeAlert(false);
        } else {
          // Foreign exchange complete — finalize (no TTS)
          const fb = foreignBubbles.get(msg.exchange_id);
          if (fb) {
            stopWorking(fb.bubble);
            fb.bubble.textContent = fb.accumulated;
            foreignBubbles.delete(msg.exchange_id);
            maybeAlert(fb.proactive);
          }
          shownIds.add(msg.exchange_id);
        }
        break;
      }

      case 'retract': {
        if (shownIds.has(msg.exchange_id)) {
          if (ownBubble) {
            stopWorking(ownBubble);
            ownBubble.textContent = "I can't help with that right now.";
            ownBubble = null; ownAccumulated = '';
          }
          setLoading(false);
        } else {
          const fb = foreignBubbles.get(msg.exchange_id);
          if (fb) { stopWorking(fb.bubble); fb.bubble.textContent = '...'; foreignBubbles.delete(msg.exchange_id); }
          shownIds.add(msg.exchange_id);
        }
        break;
      }

      case 'message': {
        // A completed exchange broadcast live from another device. Live, so it may
        // alert — unlike the catchup rows below, which are old messages replayed
        // after a reconnect and would fire a burst of pings for things already read.
        applyCatchupRow(msg, true);
        break;
      }

      case 'catchup': {
        // Delta since_id response — append-only, never wipes. See the comment on
        // this type at core/server.py's /ws handler for why it is not "history".
        for (const row of msg.messages) applyCatchupRow(row);
        if (msg.last_id && msg.last_id > lastSeenId) lastSeenId = msg.last_id;
        break;
      }

      case 'error': {
        if (shownIds.has(msg.exchange_id)) {
          if (ownBubble) {
            stopWorking(ownBubble);
            ownBubble.textContent = 'Error: ' + (msg.text || 'unknown error');
            ownBubble = null; ownAccumulated = '';
          }
          setLoading(false);
        } else {
          const fb = foreignBubbles.get(msg.exchange_id);
          if (fb) { stopWorking(fb.bubble); fb.bubble.textContent = '[Error]'; foreignBubbles.delete(msg.exchange_id); }
          shownIds.add(msg.exchange_id);
        }
        break;
      }
    }
  }

  // Shared by the live 'message' broadcast and the 'catchup' delta — append one
  // exchange if not already shown, and advance lastSeenId. Never clears the
  // conversation; that is renderHistory's job alone, for the one case (a fresh
  // connection's initial load) where wiping and rebuilding is actually correct.
  function applyCatchupRow(row, live = false) {
    if (!shownIds.has(row.exchange_id)) {
      if (!row.proactive) addMessage('user', row.user, row.ts, row.attachments);
      addMessage('assistant', row.assistant, row.ts);
      shownIds.add(row.exchange_id);
      // Only when something was actually rendered: an exchange already finalized
      // by its own 'done' frame has alerted once already, and the 'message'
      // broadcast that follows it must not alert a second time.
      if (live) maybeAlert(!!row.proactive);
    }
    if (row.id > lastSeenId) lastSeenId = row.id;
  }

  function renderHistory(messages) {
    // Don't wipe the conversation if an exchange is actively streaming on this device
    if (ownBubble) return;
    // Any foreign bubble is about to be detached by the wipe below. Stop its
    // rotation first, or the timer keeps running against an orphaned node for the
    // life of the page.
    for (const fb of foreignBubbles.values()) stopWorking(fb.bubble);
    foreignBubbles.clear();
    conversation.innerHTML = '<div class="message system">Session started. Tap the mic or type to begin.</div>';
    for (const msg of messages) {
      // Proactive exchanges were opened by Metatron, not the user. Their prompt
      // is an internal instruction to the pipeline and must never be shown as
      // something the user said.
      if (!msg.proactive) addMessage('user', msg.user, msg.ts, msg.attachments);
      addMessage('assistant', msg.assistant, msg.ts);
      shownIds.add(msg.exchange_id);
      if (msg.id > lastSeenId) lastSeenId = msg.id;
    }
    evictOldest(shownIds, 100);
    // Force: on load the newest exchange must be the one in view, whatever the
    // scroll position happened to be. Double rAF so the browser has laid the
    // messages out before scrollHeight is read.
    requestAnimationFrame(() => scrollToBottom(true));
  }

  // --- API call ---

  function sendToServer(input) {
    const provider = providerSelect.value;
    const agent = agentSelect.value;
    if (agent === 'coordinator') {
      sendViaWebSocket(input, provider);
    } else {
      // The single-agent debug path posts to /session, which takes no files. Say so
      // rather than dropping them silently — this branch is only reachable from the
      // hidden developer settings, but a silently discarded attachment would look
      // like an upload failure.
      if (readyAttachments().length) {
        addMessage('system', 'Files are only sent on the normal path — clear the agent override to attach them.');
      }
      addMessage('user', input);
      setLoading(true);
      sendBlocking(input, agent, provider);
    }
  }

  function sendViaWebSocket(input, provider) {
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      addMessage('system', 'Not connected — reconnecting...');
      return;
    }
    const exchangeId = crypto.randomUUID();
    evictOldest(shownIds, 100);
    shownIds.add(exchangeId);

    // Taken before the strip is cleared, and drawn into this device's own bubble
    // from the same list the server is told about.
    const sent = readyAttachments();

    addMessage('user', input, null, sent);
    clearAttachments();
    ownBubble = addMessage('assistant', '');
    startWorking(ownBubble);
    ownAccumulated = '';
    setLoading(true);

    ws.send(JSON.stringify({
      type: 'send',
      exchange_id: exchangeId,
      input,
      agent: 'coordinator',
      provider: provider || null,
      attachments: sent.map(a => a.id),
    }));
  }

  async function sendBlocking(input, agent, provider) {
    try {
      const res = await authFetch('/session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ input, agent, provider, persona: currentPersona }),
        signal: AbortSignal.timeout(600000),
      });

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.detail || 'Server error');
      }

      const data = await res.json();
      addMessage('assistant', data.response);
      speakResponse(data.response);
    } catch (e) {
      addMessage('system', `Error: ${e.message}`);
    } finally {
      setLoading(false);
    }
  }

  function setLoading(on) {
    sendBtn.disabled = on;
    if (on) {
      micBtn.classList.add('loading');
      micBtn.textContent = 'Thinking...';
      setStatus('Waiting for response...', '#888');
    } else {
      micBtn.classList.remove('loading');
      micBtn.textContent = 'Tap to Speak';
      setStatus('Ready', '#555');
    }
  }

  // --- STT via server-side Whisper (audio never leaves this device → Mac over Tailscale) ---

  let mediaRecorder = null;
  let audioChunks = [];
  let isRecording = false;
  // Set the instant the mic is asked for, before getUserMedia resolves. Guards the
  // window in which a reply could still start playing into a recording about to begin.
  let micIntent = false;
  let silenceTimer = null;
  let silencePoller = null;
  let audioCtx = null;
  let analyser = null;
  const SILENCE_MS = 2500;
  const SILENCE_RMS = 0.04;  // 0–1 normalised; tune up if triggering on background noise

  function resetMic() {
    micBtn.classList.remove('listening', 'loading');
    micBtn.disabled = false;
    micBtn.textContent = 'Tap to Speak';
    setStatus('Ready', '#555');
  }

  function stopSilenceDetection() {
    if (silencePoller) { clearInterval(silencePoller); silencePoller = null; }
    if (silenceTimer)  { clearTimeout(silenceTimer);   silenceTimer  = null; }
    if (analyser)      { analyser.disconnect();         analyser      = null; }
    if (audioCtx)      { audioCtx.close();              audioCtx      = null; }
  }

  function stopRecording() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  }

  async function startRecording() {
    // Silence any reply still playing before the mic opens. Independent of the voice
    // toggle and worth keeping even with voice on: the reported failure was TTS
    // arriving late and talking over a follow-up already being recorded, which the
    // toggle only avoids by turning the feature off entirely.
    stopSpeaking();

    // Claim silence before awaiting the mic, not after. isRecording is only set once
    // getUserMedia resolves, which on a cold permission prompt can be seconds — and a
    // reply landing in that window would play into the recording that is about to
    // start. Set here and cleared on every exit path below.
    micIntent = true;

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      micIntent = false;
      setStatus('Mic blocked: ' + err.name, '#a44');
      document.getElementById('grant-wrap').style.display = 'block';
      return;
    }

    audioChunks = [];
    isRecording = true;
    micBtn.classList.add('listening');
    micBtn.textContent = 'Tap to Stop';
    setStatus('Recording...', '#4a7');
    hideTranscript();

    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };

    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      stopSilenceDetection();
      isRecording = false;
      micIntent = false;   // recording is over; replies may speak again
      micBtn.classList.remove('listening');
      micBtn.textContent = 'Tap to Speak';

      if (audioChunks.length === 0) { setStatus('No audio captured', '#666'); return; }

      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      audioChunks = [];

      setStatus('Transcribing...', '#888');
      micBtn.classList.add('loading');
      micBtn.disabled = true;

      try {
        const fd = new FormData();
        fd.append('audio', blob, `${Date.now()}.webm`);
        const url = '/transcribe' + (currentPersona ? '?persona=' + encodeURIComponent(currentPersona) : '');
        const res = await authFetch(url, { method: 'POST', body: fd });
        if (!res.ok) throw new Error((await res.json()).detail || 'Transcription failed');
        const { transcript: text } = await res.json();
        showTranscript(text);
        micBtn.classList.remove('loading');
        micBtn.disabled = false;
        if (text.trim()) {
          sendToServer(text.trim());
        } else {
          setStatus('No speech detected', '#666');
        }
      } catch (e) {
        setStatus('Error: ' + (e.message || 'unknown'), '#a44');
        micBtn.classList.remove('loading');
        micBtn.disabled = false;
        // leave status visible — do not reset
      }
    };

    mediaRecorder.start();

    // Silence detection: stop automatically after SILENCE_MS of quiet post-speech
    try {
      audioCtx = new AudioContext();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      audioCtx.createMediaStreamSource(stream).connect(analyser);
      const buf = new Uint8Array(analyser.frequencyBinCount);
      let speechSeen = false;

      silencePoller = setInterval(() => {
        if (!isRecording) return;
        analyser.getByteFrequencyData(buf);
        const rms = Math.sqrt(buf.reduce((s, v) => s + v * v, 0) / buf.length) / 255;
        if (rms > SILENCE_RMS) {
          speechSeen = true;
          if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
        } else if (speechSeen && !silenceTimer) {
          silenceTimer = setTimeout(() => { if (isRecording) stopRecording(); }, SILENCE_MS);
        }
      }, 150);
    } catch {}
  }

  // Mic permission check on load
  const grantWrap = document.getElementById('grant-wrap');
  const grantBtn  = document.getElementById('grant-btn');

  function requestMicPermission() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('Mic unavailable (needs HTTPS)', '#a44');
      grantWrap.style.display = 'block';
      return Promise.resolve();
    }
    return navigator.mediaDevices.getUserMedia({ audio: true })
      .then(s => { s.getTracks().forEach(t => t.stop()); setStatus('Ready', '#555'); grantWrap.style.display = 'none'; })
      .catch(err => { setStatus('Mic blocked: ' + err.name, '#a44'); grantWrap.style.display = 'block'; });
  }
  grantBtn.addEventListener('click', requestMicPermission);
  requestMicPermission();

  micBtn.textContent = 'Tap to Speak';
  micBtn.addEventListener('click', () => {
    if (micBtn.disabled) return;
    if (isRecording) stopRecording(); else startRecording();
  });

  // --- TTS ---

  let audioCtxShared = null;  // single shared AudioContext — resumed on first gesture
  let currentSource = null;   // active BufferSourceNode, so we can stop on interrupt

  // Safari and Android both require a user gesture before audio can play.
  // We resume a shared AudioContext on first tap; all playback goes through it
  // so decodeAudioData/start() are always allowed after this point.
  function unlockAudio() {
    if (audioCtxShared) return;
    try {
      audioCtxShared = new (window.AudioContext || window.webkitAudioContext)();
      audioCtxShared.resume();
    } catch {}
  }
  document.addEventListener('click', unlockAudio, { once: true });
  document.addEventListener('touchend', unlockAudio, { once: true });

  // --- Spoken replies (toggle) ---
  //
  // Off by default. TTS runs behind the reply, so on a slow synthesis the audio was
  // still arriving while the user had already tapped the mic to follow up — speaking
  // over them mid-recording. Making it a toggle rather than removing it keeps voice
  // one tap away without another APK rebuild, which is the whole reason it is a
  // control and not a constant.
  let voiceEnabled = localStorage.getItem('metatron_voice') === 'on';

  function stopSpeaking() {
    if (currentSource) { try { currentSource.stop(); } catch {} currentSource = null; }
    // The catch-path fallback in speakResponse uses the Web Speech API, which has its
    // own queue that stopping the buffer source does not touch.
    try { window.speechSynthesis?.cancel(); } catch {}
  }

  function renderVoiceToggle() {
    const btn = document.getElementById('voice-toggle');
    btn.classList.toggle('on', voiceEnabled);
    btn.textContent = voiceEnabled ? '🔊' : '🔇';
    btn.title = voiceEnabled ? 'Spoken replies on — tap to silence' : 'Spoken replies off — tap to enable';
  }

  document.getElementById('voice-toggle').addEventListener('click', () => {
    voiceEnabled = !voiceEnabled;
    localStorage.setItem('metatron_voice', voiceEnabled ? 'on' : 'off');
    if (!voiceEnabled) stopSpeaking();   // silence what is already playing, not just the next one
    renderVoiceToggle();
  });

  renderVoiceToggle();

  // --- New-message alerts ---
  //
  // A reply lands tens of seconds after it is asked for — the wait is dominated by
  // thinking, not delivery — so the phone is usually back in a pocket by the time
  // it arrives. Three settings rather than one: when to alert, and whether each of
  // sound and vibration is used, because "tell me about everything" and "tell me
  // only when I'm away" are different needs, and on a phone in a meeting the right
  // answer is vibration without sound.

  const ALERT_SCOPES = ['always', 'hidden', 'proactive', 'off'];

  let alertScope   = localStorage.getItem('metatron_alert_scope') || 'always';
  let alertSound   = localStorage.getItem('metatron_alert_sound')   !== 'off';   // default on
  let alertVibrate = localStorage.getItem('metatron_alert_vibrate') !== 'off';   // default on
  if (!ALERT_SCOPES.includes(alertScope)) alertScope = 'always';

  // Built from an oscillator rather than a bundled sound file: no asset to ship in
  // the APK, no fetch, no decode, and it plays through the same AudioContext the
  // spoken-reply path already unlocks on the first tap. It cannot play before that
  // first tap — which is the reason vibration is a separate toggle rather than a
  // detail of this one.
  function playPing() {
    if (!audioCtxShared) return;
    try {
      const ctx = audioCtxShared;
      ctx.resume();
      const now = ctx.currentTime;

      const gain = ctx.createGain();
      gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.16, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.32);

      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now);            // A5
      osc.frequency.setValueAtTime(1174.66, now + 0.09); // D6
      osc.connect(gain);
      osc.start(now);
      osc.stop(now + 0.34);
    } catch {}
  }

  function vibrateAlert() {
    // Absent on desktop and in some WebViews, where it is a silent no-op — which is
    // the other half of why sound and vibration are toggled independently.
    try { if (navigator.vibrate) navigator.vibrate([40, 60, 40]); } catch {}
  }

  // isProactive: true when Metatron opened the exchange rather than answering the user.
  function maybeAlert(isProactive) {
    if (alertScope === 'off') return;
    if (alertScope === 'hidden' && document.visibilityState === 'visible') return;
    if (alertScope === 'proactive' && !isProactive) return;
    // A beep into an open mic is the same failure spoken replies already guard
    // against — it would be recorded as if the user had said it.
    if (alertSound && !isRecording && !micIntent) playPing();
    if (alertVibrate) vibrateAlert();
  }

  function renderAlertControls() {
    const btn = document.getElementById('alert-toggle');
    const live = alertScope !== 'off' && (alertSound || alertVibrate);
    btn.classList.toggle('on', live);
    btn.textContent = live ? '🔔' : '🔕';
    document.getElementById('alert-scope').value = alertScope;
    document.getElementById('alert-sound').checked = alertSound;
    document.getElementById('alert-vibrate').checked = alertVibrate;
    document.getElementById('alert-note').textContent =
      alertScope === 'hidden' ? 'Silent while this screen is in front of you.'
      : alertScope === 'proactive' ? 'Silent for replies to your own messages.'
      : alertScope === 'off' ? 'No alerts.'
      : 'Alerts on every message that arrives.';
  }

  document.getElementById('alert-toggle').addEventListener('click', () => {
    document.getElementById('alert-settings').classList.toggle('shown');
  });

  document.getElementById('alert-scope').addEventListener('change', (e) => {
    alertScope = e.target.value;
    localStorage.setItem('metatron_alert_scope', alertScope);
    renderAlertControls();
  });

  // Changing a switch previews what it does. Otherwise the only way to find out
  // whether the ping is audible on this device is to send a message and wait out
  // the reply — and a setting that cannot be tested is one that gets left alone.
  document.getElementById('alert-sound').addEventListener('change', (e) => {
    alertSound = e.target.checked;
    localStorage.setItem('metatron_alert_sound', alertSound ? 'on' : 'off');
    if (alertSound) playPing();
    renderAlertControls();
  });

  document.getElementById('alert-vibrate').addEventListener('change', (e) => {
    alertVibrate = e.target.checked;
    localStorage.setItem('metatron_alert_vibrate', alertVibrate ? 'on' : 'off');
    if (alertVibrate) vibrateAlert();
    renderAlertControls();
  });

  renderAlertControls();

  // Silence is checked at every point where playback could begin, not only on entry.
  //
  // The reported failure was a *delayed* reply talking over a recording, and the delay
  // is the await on /tts below — several seconds of synthesis. Checking only at the top
  // of this function, or only calling stopSpeaking() when recording starts, both miss
  // the case that actually happens: the mic opens while the TTS request is still in
  // flight, and the audio arrives afterwards with nothing left to stop it.
  //
  // Late audio is discarded rather than queued. A spoken answer to the message before
  // last, played after the user has moved on, is worse than silence.
  function speechBlocked() {
    return !voiceEnabled || isRecording || micIntent;
  }

  async function speakResponse(text) {
    if (speechBlocked()) return;
    stopSpeaking();
    try {
      const res = await authFetch('/tts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      if (!res.ok) throw new Error('TTS failed');
      const arrayBuffer = await res.arrayBuffer();
      if (speechBlocked()) return;            // mic opened while /tts was synthesising
      if (!audioCtxShared) unlockAudio();
      await audioCtxShared.resume();
      const audioBuffer = await audioCtxShared.decodeAudioData(arrayBuffer);
      if (speechBlocked()) return;            // and again after decode, which also awaits
      const source = audioCtxShared.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(audioCtxShared.destination);
      currentSource = source;
      source.onended = () => { if (currentSource === source) currentSource = null; };
      source.start(0);
    } catch {
      if (speechBlocked()) return;            // the fallback path can talk over you too
      const utt = new SpeechSynthesisUtterance(text);
      utt.rate = 0.95;
      window.speechSynthesis?.speak(utt);
    }
  }

  // --- Web Push registration ---

  async function subscribePush(reg) {
    const keyRes = await authFetch('/vapid-public-key');
    const { publicKey } = await keyRes.json();
    if (!publicKey) return;
    const padding = '='.repeat((4 - publicKey.length % 4) % 4);
    const base64 = (publicKey + padding).replace(/-/g, '+').replace(/_/g, '/');
    const raw = Uint8Array.from(atob(base64), c => c.charCodeAt(0));

    // Unsubscribe any existing subscription — key may have rotated
    const existing = await reg.pushManager.getSubscription();
    if (existing) await existing.unsubscribe();

    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: raw,
    });
    await authFetch('/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(sub.toJSON()),
    });
    return sub;
  }

  // Set at startup by the unconditional registration at the bottom of this script.
  let swRegistration = null;

  async function initPush() {
    const wrap = document.getElementById('notif-wrap');
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
      wrap.innerHTML = '<span style="color:#333;font-size:11px">push-unsupported</span>';
      return;
    }
    const perm = Notification.permission;

    if (perm === 'denied') {
      wrap.innerHTML = '<span style="color:#333;font-size:11px">notif blocked — enable in Chrome site settings</span>';
      return;
    }

    if (perm !== 'granted') {
      // Show button immediately — don't wait for SW registration
      wrap.innerHTML = '<button id="notif-btn" style="background:#1a1a1a;border:1px solid #333;border-radius:20px;color:#666;font-size:12px;padding:6px 16px;cursor:pointer">Enable notifications</button>';
      document.getElementById('notif-btn').addEventListener('click', async () => {
        try {
          const result = await Notification.requestPermission();
          if (result === 'granted') {
            wrap.innerHTML = '<span style="color:#444;font-size:12px">Notifications on — setting up...</span>';
            await swRegistration;   // rejects if startup registration failed
            const reg = await navigator.serviceWorker.ready;
            await subscribePush(reg);
            wrap.innerHTML = '<span style="color:#444;font-size:12px">Notifications on</span>';
          } else {
            wrap.innerHTML = '<span style="color:#333;font-size:12px">Notifications blocked</span>';
          }
        } catch(e) {
          wrap.innerHTML = `<span style="color:#333;font-size:11px">notif error: ${e.message}</span>`;
          console.warn('Push setup failed:', e);
        }
      });
      return;
    }

    // Already granted — subscribe silently against the startup registration
    try {
      await swRegistration;   // rejects if startup registration failed
      const reg = await navigator.serviceWorker.ready;
      await subscribePush(reg);
      wrap.innerHTML = '<span style="color:#444;font-size:12px">Notifications on</span>';
    } catch(e) { console.warn('Push subscribe failed:', e); }
  }

  // --- Text input ---

  // --- Approval of irreversible actions ---
  //
  // The model may propose; only this can approve. The token it holds is inert until the
  // server records a tap here, so a model talked into acting by a hostile email still
  // cannot proceed — which is the case the whole mechanism exists for.
  //
  // Polled rather than pushed: a missed push would silently strand an action, and the
  // call is small. Stops while the login screen is up.
  let pendingToken = null;

  async function refreshPending() {
    if (!currentPersona || !authToken) return;
    try {
      const res = await authFetch('/pending-confirmations?persona=' + encodeURIComponent(currentPersona));
      if (!res.ok) return;
      const { pending } = await res.json();
      const bar = document.getElementById('confirm-bar');
      if (!pending || !pending.length) {
        pendingToken = null;
        bar.classList.remove('shown');
        return;
      }
      const item = pending[0];   // one at a time — stacked approvals invite mis-taps
      pendingToken = item.token;
      document.getElementById('confirm-text').textContent = item.description;
      document.getElementById('confirm-yes').disabled = false;
      bar.classList.add('shown');
    } catch (e) { /* offline or signed out — the poll retries */ }
  }

  document.getElementById('confirm-yes').addEventListener('click', async () => {
    if (!pendingToken) return;
    const btn = document.getElementById('confirm-yes');
    btn.disabled = true;
    try {
      const res = await authFetch('/confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: pendingToken, persona: currentPersona }),
      });
      if (!res.ok) { setStatus('Could not record approval', '#a44'); btn.disabled = false; return; }
      document.getElementById('confirm-bar').classList.remove('shown');
      pendingToken = null;
      // The server carries the action out and broadcasts the outcome as an ordinary
      // exchange, so it arrives over the socket like any other message — nothing to
      // render here. This used to nudge the pipeline instead ("Approved — go ahead."),
      // hoping the model would retry with the token it held. It never could: the token
      // came back inside a tool result and is gone from its context by the next turn,
      // so the approval expired unspent and the reply said it was still waiting.
      // [DB-0815-03].
    } catch (e) {
      setStatus('Could not record approval', '#a44');
      btn.disabled = false;
    }
  });

  document.getElementById('confirm-no').addEventListener('click', () => {
    // No server call: an unapproved request simply expires. Declining is the default
    // state, so there is nothing to record.
    document.getElementById('confirm-bar').classList.remove('shown');
    pendingToken = null;
  });

  setInterval(refreshPending, 5000);

  function submitText() {
    const text = textField.value.trim();
    // A photograph with no words is a complete message — "look at this" is implied
    // by the act of attaching it.
    if (!text && !readyAttachments().length) return;
    if (uploadsPending()) { setStatus('Still attaching…', '#888'); return; }
    textField.value = '';
    sendToServer(text);
  }

  sendBtn.addEventListener('click', submitText);
  textField.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitText(); }
  });


  // Register the service worker unconditionally, before and independently of login.
  // This is what installs the offline shell: without a registered worker there is no
  // fetch handler, so a phone that cannot reach the server falls back to the browser's
  // own error page. Registration used to happen only inside initPush(), gated on
  // PushManager support and notification permission — so a user who declined
  // notifications, or a WebView with no PushManager, never got a shell.
  //
  // initPush() no longer registers; it awaits navigator.serviceWorker.ready and uses
  // that registration. Registering the same URL twice is a no-op per spec, but having
  // one owner of the registration keeps the push UI and the offline shell independent.
  if ('serviceWorker' in navigator) {
    swRegistration = navigator.serviceWorker.register('/sw.js');
    // Logged on a derived promise so the original still rejects for initPush to
    // catch — awaiting .ready alone would hang forever if registration failed.
    swRegistration.catch((e) => console.warn('Service worker registration failed:', e));
  }

  // Auto-login if persona saved — must run after all variables and handlers are initialized
  const savedPersona = localStorage.getItem('metatron_persona');
  if (savedPersona) {
    document.getElementById('login-persona-select').value = savedPersona;
  }
  // Auto-enter only with a token in hand. Without one every call would 401 and bounce
  // straight back here, so the login screen is the honest starting point. The token
  // outlives a restart (it is signed, not stored server-side), so this is still the
  // usual path — the user is not asked for a password on every app open.
  if (savedPersona && authToken) {
    enterApp(savedPersona);
  }
</script>
</body>
</html>
