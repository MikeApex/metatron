        if (!still || still.state !== 'sent') return;
        // Treat the socket as the corpse it is. ensureConnected closes it, onclose
        // releases the bubble, and the reconnect's history frame resends this.
        lastMessageAt = 0;
        ensureConnected();
      }, OUTBOX_ACCEPT_TIMEOUT_MS);
    }
  }

  // Send the oldest message still owed, if nothing else is in flight.
  function flushOutbox() {
    if (!currentPersona || ownBubble || !canSend()) { renderOutbox(); return; }
    const now = Date.now();
    for (const e of outbox) {
      if (e.state === 'failed' || e.state === 'held') continue;
      const tooOld = !e.auto && now - (e.releasedAt || e.writtenAt) > OUTBOX_AUTO_SEND_MS;
      if (tooOld || (e.sends || 0) >= OUTBOX_MAX_AUTO_SENDS) {
        e.state = 'held';
        saveOutbox();
        renderOutboxEntry(e);
        continue;
      }
      transmit(e);
      return;
    }
  }

  // opts.auto: a headset turn — sent without a tap, carrying no attachments (a photo
  // in the strip belongs to the on-screen batch being put together, not to a press).
  function queueMessage(input, opts = {}) {
    const e = {
      id: crypto.randomUUID(),
      input,
      attachments: opts.auto ? [] : readyAttachments(),
      provider: providerSelect.value || null,
      source: opts.source || turnSource(),
      writtenAt: Date.now(),
      sends: 0,
      state: 'queued',
      auto: !!opts.auto,
      recordedAt: opts.recordedAt || null,
    };
    outbox.push(e);
    saveOutbox();
    if (!opts.auto) clearAttachments();
    renderOutboxEntry(e);
    flushOutbox();
  }

  window.addEventListener('offline', renderOutbox);
  window.addEventListener('online', renderOutbox);
  // --- end outbox ---

  // --- Voice tray ---
  //
  // The on-screen mic no longer sends by itself. Each recording becomes a snippet here,
  // showing what was heard, with a ✕ to delete it; Send takes them all as one message,
  // together with anything typed and attached. Mike's ask (2026-10-15): capture thoughts
  // through the day "without submitting immediately", sent as a batch, kept "distinct by
  // entry/time". So a batch goes one paragraph per snippet, each stamped with when it was
  // RECORDED (Mike, 2026-10-23) — the pipeline otherwise sees only when it arrived.
  //
  // Headset mode is the exception (Mike, 2026-10-23): with the screen dark there is
  // nothing to press, so a headset recording sends itself once it is transcribed — and
  // one that cannot be transcribed yet waits here and still sends itself later, rather
  // than vanishing with an error nobody could see.
  //
  // Snippets survive closing the app: text in localStorage, and audio that is not yet
  // transcribed in IndexedDB. Audio is deleted the moment its transcript exists, so the
  // only audio ever held on the phone is audio that could not reach the server.

  // A single snippet sent within this long of being recorded goes exactly as a voice
  // message always has, unstamped — its time is the time it arrives.
  const SNIPPET_STAMP_AFTER_MS = 2 * 60 * 1000;
  // /transcribe answers 503 while it is busy with someone else's recording.
  const TRANSCRIBE_BUSY_RETRY_MS = 3000;
  const TRANSCRIBE_BUSY_MAX_TRIES = 20;
  // A failure with the socket still up — a 5xx, a WebView fetch failing on its own —
  // gets no reconnect to retry it, so it is retried on this clock as well.
  const TRANSCRIBE_WAITING_RETRY_MS = 30000;
  let waitingRetryTimer = null;
  // A server error, unlike a lost connection, costs the VM something each time: the
  // clip is uploaded and may be decoded and run through Whisper again, holding the one
  // transcription slot. So it is retried this many times and then waits for a tap,
  // with its audio kept. Without a cap, a server that always fails would be fed the
  // same recording every 30s from every open tab, and no meter would show it.
  const TRANSCRIBE_SERVER_MAX_TRIES = 5;

  // {key, recordedAt, text, state, auto, source, error}
  // state: pending | transcribing | waiting (no connection) | ready | failed
  let snippets = [];
  const snippetAudio = new Map();   // key → Blob, so a transcription need not read storage
  let transcribing = false;
  let busyTries = 0;

  function snippetsKey() { return 'metatron_snippets_' + currentPersona; }

  function saveSnippets() {
    try { localStorage.setItem(snippetsKey(), JSON.stringify(snippets)); } catch {}
  }

  // IndexedDB, because a Blob cannot go into localStorage and a minute of audio is too
  // large to base64 into it. Every failure here degrades to memory only: the snippet
  // still works, it just would not survive the app being closed.
  let audioDbPromise = null;
  function audioDb() {
    if (!audioDbPromise) {
      audioDbPromise = new Promise((resolve, reject) => {
        if (!window.indexedDB) { reject(new Error('no indexedDB')); return; }
        const req = indexedDB.open('metatron-audio', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('clips');
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    return audioDbPromise;
  }

  async function audioStore(mode, op) {
    const db = await audioDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('clips', mode);
      const req = op(tx.objectStore('clips'));
      tx.oncomplete = () => resolve(req ? req.result : undefined);
      tx.onerror = () => reject(tx.error);
    });
  }

  function audioKey(key) { return currentPersona + ':' + key; }

  function dropAudio(key) {
    snippetAudio.delete(key);
    audioStore('readwrite', s => s.delete(audioKey(key))).catch(() => {});
  }

  async function snippetBlob(key) {
    if (snippetAudio.has(key)) return snippetAudio.get(key);
    try {
      const blob = await audioStore('readonly', s => s.get(audioKey(key)));
      if (blob) snippetAudio.set(key, blob);
      return blob || null;
    } catch { return null; }
  }

  // Audio whose snippet is gone — a crash between the two deletes — is removed at load,
  // so nothing accumulates on the phone that no screen shows.
  async function sweepAudio() {
    try {
      const prefix = currentPersona + ':';
      const live = new Set(snippets.map(sn => audioKey(sn.key)));
      const keys = await audioStore('readonly', s => s.getAllKeys());
      for (const k of keys || []) {
        if (typeof k === 'string' && k.startsWith(prefix) && !live.has(k)) {
          audioStore('readwrite', s => s.delete(k)).catch(() => {});
        }
      }
    } catch {}
  }

  function loadSnippets() {
    snippetAudio.clear();
    try { snippets = JSON.parse(localStorage.getItem(snippetsKey()) || '[]'); } catch { snippets = []; }
    if (!Array.isArray(snippets)) snippets = [];
    // A transcription the app was closed in the middle of starts again.
    for (const sn of snippets) if (sn.state === 'transcribing') sn.state = 'pending';
    renderTray();
    sweepAudio();
    pumpTranscription();
  }

  function snippetLabel(sn) {
    const tail = sn.auto ? ' — sends by itself' : '';
    if (sn.state === 'ready') return sn.text;
    if (sn.state === 'failed') return sn.error || 'Could not be transcribed';
    if (sn.state === 'waiting') return 'Not transcribed yet — will retry' + tail;
    return 'Transcribing…' + tail;
  }

  function renderTray() {
    const tray = document.getElementById('voice-tray');
    tray.innerHTML = '';
    tray.classList.toggle('shown', snippets.length > 0);
    for (const sn of snippets) {
      const row = document.createElement('div');
      row.className = 'snippet'
        + (sn.state === 'failed' ? ' failed' : sn.state === 'ready' ? '' : ' in-progress');
      const time = document.createElement('span');
      time.className = 'snippet-time';
      time.textContent = formatTime(sn.recordedAt);
      const text = document.createElement('span');
      text.className = 'snippet-text';
      text.textContent = snippetLabel(sn);
      if (sn.state === 'failed' && sn.retryable) {
        text.style.cursor = 'pointer';
        text.addEventListener('click', () => {
          sn.state = 'pending'; sn.serverFails = 0; sn.retryable = false;
          saveSnippets(); renderTray(); pumpTranscription();
        });
      }
      const x = document.createElement('span');
      x.className = 'chip-x';
      x.textContent = '✕';
      x.title = 'Delete this recording';
      x.addEventListener('click', () => removeSnippet(sn));
      row.append(time, text, x);
      tray.appendChild(row);
    }
    // What Send will carry: a recording that failed stays visible but goes nowhere.
    const n = snippets.filter(sn => !sn.auto && sn.state !== 'failed').length;
    sendBtn.textContent = n ? `Send · ${n} recording${n === 1 ? '' : 's'}` : 'Send';
  }

  function removeSnippet(sn) {
    snippets = snippets.filter(x => x !== sn);
    dropAudio(sn.key);
    saveSnippets();
    renderTray();
  }

  function addSnippet(blob, recordedAt, auto, source) {
    const sn = {
      key: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
      recordedAt: recordedAt || Date.now(),
      text: null,
      state: 'pending',
      auto: !!auto,
      source,
    };
    snippets.push(sn);
    snippetAudio.set(sn.key, blob);
    saveSnippets();
    audioStore('readwrite', s => s.put(blob, audioKey(sn.key))).catch(() => {});
    renderTray();
    pumpTranscription();
  }

  // One outcome per kind of failure, because each needs a different next step: busy is
  // retried shortly, offline waits for the connection, unreadable stops.
  async function transcribeBlob(blob) {
    const fd = new FormData();
    fd.append('audio', blob, `${Date.now()}.webm`);
    const url = '/transcribe' + (currentPersona ? '?persona=' + encodeURIComponent(currentPersona) : '');
    let res;
    try { res = await authFetch(url, { method: 'POST', body: fd }); }
    catch { return { kind: 'offline' }; }
    if (res.status === 503) return { kind: 'busy' };
    if (res.status === 422) return { kind: 'unreadable' };
    if (!res.ok) return { kind: 'server' };
    let transcript = '';
    try { transcript = (await res.json()).transcript || ''; } catch { return { kind: 'offline' }; }
    const text = transcript.trim();
    return text ? { kind: 'text', text } : { kind: 'empty' };
  }

  // One recording at a time, oldest first: /transcribe holds one job and refuses a second.
  async function pumpTranscription() {
    if (transcribing || !currentPersona) return;
    const sn = snippets.find(x => x.state === 'pending');
    if (!sn) return;
    transcribing = true;
    sn.state = 'transcribing';
    renderTray();
    const blob = await snippetBlob(sn.key);
    const outcome = blob ? await transcribeBlob(blob) : { kind: 'lost' };
    transcribing = false;
    if (!snippets.includes(sn)) { pumpTranscription(); return; }   // deleted meanwhile

    if (outcome.kind === 'busy' && ++busyTries <= TRANSCRIBE_BUSY_MAX_TRIES) {
      sn.state = 'pending';
      saveSnippets();
      renderTray();
      setTimeout(pumpTranscription, TRANSCRIBE_BUSY_RETRY_MS);
      return;
    }
    busyTries = 0;
    if (outcome.kind === 'text') {
      sn.text = outcome.text;
      sn.state = 'ready';
      dropAudio(sn.key);
      if (sn.auto) { sendAutoSnippet(sn); }
    } else if (outcome.kind === 'empty') {
      removeSnippet(sn);
      setStatus('No speech detected', '#666');
    } else if (outcome.kind === 'unreadable') {
      sn.state = 'failed';
      sn.error = "Couldn't make out that recording";
      dropAudio(sn.key);
    } else if (outcome.kind === 'lost') {
      sn.state = 'failed';
      sn.error = 'That recording was lost';
    } else if (outcome.kind === 'server'
               && (sn.serverFails = (sn.serverFails || 0) + 1) >= TRANSCRIBE_SERVER_MAX_TRIES) {
      sn.state = 'failed';
      sn.error = "Couldn't be transcribed — tap to try again";
      sn.retryable = true;
    } else {
      // Offline, a server error, or busy past the limit. Whatever is queued behind it
      // would meet the same failure, so it all waits together and is said to — a
      // snippet labelled "Transcribing…" with no request in flight is a lie.
      sn.state = 'waiting';
      for (const other of snippets) if (other.state === 'pending') other.state = 'waiting';
      if (!waitingRetryTimer) {
        waitingRetryTimer = setTimeout(retryWaitingSnippets, TRANSCRIBE_WAITING_RETRY_MS);
      }
    }
    saveSnippets();
    renderTray();
    if (sn.state !== 'waiting') pumpTranscription();
  }

  function retryWaitingSnippets() {
    if (waitingRetryTimer) { clearTimeout(waitingRetryTimer); waitingRetryTimer = null; }
    let any = false;
    for (const sn of snippets) if (sn.state === 'waiting') { sn.state = 'pending'; any = true; }
    if (any) { saveSnippets(); renderTray(); }
    pumpTranscription();
  }

  // A headset recording, transcribed: out of the tray and into the outbox as its own
  // message, exactly as a headset turn always went. Not subject to the outbox's age
  // limit — Mike heard the "sent" cue and believes it went — but stamped with when it
  // was said if it is going late (stampIfLate).
  function sendAutoSnippet(sn) {
    snippets = snippets.filter(x => x !== sn);
    saveSnippets();
    renderTray();
    showTranscript(sn.text);
    queueMessage(sn.text, { auto: true, recordedAt: sn.recordedAt, source: sn.source });
  }

  // The tray's snippets plus anything typed, as the one message Send will queue.
  function composeBatch(ready, typed) {
    if (!ready.length) return typed;
    const stamp = ready.length > 1
      || Date.now() - ready[0].recordedAt >= SNIPPET_STAMP_AFTER_MS;
    const parts = ready.map(sn => stamp ? `[${formatTime(sn.recordedAt)}] ${sn.text}` : sn.text);
    if (typed) parts.push(typed);
    return parts.join('\n\n');
  }

  window.addEventListener('online', retryWaitingSnippets);
  // --- end voice tray ---

  async function sendBlocking(input, agent, provider) {
    try {
      const res = await authFetch('/session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ input, agent, provider, persona: currentPersona }),
        signal: AbortSignal.timeout(600000),
      });

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.detail || 'Server error');
      }

      const data = await res.json();
      addMessage('assistant', data.response);
      speakResponse(data.response);
    } catch (e) {
      addMessage('system', `Error: ${e.message}`);
    } finally {
      setLoading(false);
    }
  }

  function setLoading(on) {
    sendBtn.disabled = on;
    // The mic stays usable while a reply is on its way — recording the next thought
    // during the wait is what the tray is for — so a live recording keeps its label.
    if (isRecording) return;
    if (on) {
      micBtn.classList.add('loading');
      micBtn.textContent = 'Thinking...';
      setStatus('Waiting for response...', '#888');
    } else {
      micBtn.classList.remove('loading');
      micBtn.textContent = 'Tap to Speak';
      setStatus('Ready', '#555');
    }
  }

  // The mic's resting label once a recording ends: whatever setLoading would show now.
  function renderMicIdle() { setLoading(!!ownBubble); }

  // --- STT via server-side Whisper (audio never leaves this device → Mac over Tailscale) ---

  let mediaRecorder = null;
  let audioChunks = [];
  let isRecording = false;
  // Set the instant the mic is asked for, before getUserMedia resolves. Guards the
  // window in which a reply could still start playing into a recording about to begin.
  let micIntent = false;
  let silenceTimer = null;
  let silencePoller = null;
  let audioCtx = null;
  let analyser = null;
  const SILENCE_MS = 2500;
  const SILENCE_RMS = 0.04;  // 0–1 normalised; tune up if triggering on background noise

  // Headset mode replaces the silence auto-stop with a hard cap, because the two
  // cannot coexist: with the screen dark, silence would send the turn and the
  // user's own "now send it" press would then REOPEN the mic into pocket noise,
  // sending a second turn nobody asked for. So while armed, only a press sends.
  //
  // The cap exists for the opposite mistake — a press whose second press never
  // comes. It DISCARDS rather than sends. Sending would turn one stray pocket
  // press into a two-minute Whisper job plus, on pocket noise rather than silence,
  // a full pipeline turn: the most expensive outcome available here, from the
  // cheapest possible mistake. A turn the user never ended is not one to send.
  // Silence ends an armed turn, because on this hardware the button cannot.
  //
  // This REVERSES the original design, on measured evidence (2026-09-24). Auto-stop was
  // disabled while armed to prevent one specific failure: silence sends the turn, then
  // the user's own send-press REOPENS the mic into pocket noise and fires a second turn.
  // That failure cannot occur on a Bluetooth headset, because opening the mic switches
  // the link from A2DP to HFP/SCO and the bud's button stops emitting a media key
  // altogether — measured on JLab Go Air Sport: the first hold opens the mic, the second
  // produces no tone and no event at all. The press that would have reopened the mic
  // never arrives, so the conflict the rule guarded against does not exist.
  //
  // SAME 2500ms as the on-screen path, deliberately. A first attempt widened this to
  // 4000ms on the theory that an armed turn begins with a tone and the user would be
  // mid-thought when it sounded. That was reasoning, not evidence — Mike had been using
  // 2.5s daily and reported it ending "perfectly fine", and the widened window read as
  // the feature being broken. Do not raise it again without a turn that actually got
  // cut off to point at.
  const HEADSET_MAX_RECORD_MS = 120000;
  let maxRecordTimer = null;
  let discardRecording = false;   // set by the cap; read in mediaRecorder.onstop
  let recordStartedAt = 0;        // stamps the snippet: when it was said, not when sent
  // Declared here, beside the recording code that reads it, rather than in the
  // headset block far below: startRecording() runs before that block's `let` would
  // otherwise be initialised on some paths, and a temporal-dead-zone throw inside
  // the mic path would read as "the mic is broken".
  let headsetMode = false;

  function resetMic() {
    micBtn.classList.remove('listening', 'loading');
    micBtn.disabled = false;
    micBtn.textContent = 'Tap to Speak';
    setStatus('Ready', '#555');
  }

  function stopSilenceDetection() {
    if (silencePoller) { clearInterval(silencePoller); silencePoller = null; }
    if (silenceTimer)  { clearTimeout(silenceTimer);   silenceTimer  = null; }
    if (maxRecordTimer){ clearTimeout(maxRecordTimer); maxRecordTimer = null; }
    if (analyser)      { analyser.disconnect();         analyser      = null; }
    if (audioCtx)      { audioCtx.close();              audioCtx      = null; }
  }

  function stopRecording() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  }

  async function startRecording() {
    // Silence any reply still playing before the mic opens. Independent of the voice
    // toggle and worth keeping even with voice on: the reported failure was TTS
    // arriving late and talking over a follow-up already being recorded, which the
    // toggle only avoids by turning the feature off entirely.
    stopSpeaking();

    // Re-entrancy guard. isRecording is only set once getUserMedia resolves, which on
    // a cold permission prompt is seconds, so two calls in that window both proceed:
    // the second overwrites mediaRecorder and the first MediaStream is never stopped,
    // leaving a live microphone with nothing holding a reference to close it. micIntent
    // already marks the window — it just was not being read.
    if (micIntent || isRecording) return;

    // Claim silence before awaiting the mic, not after. isRecording is only set once
    // getUserMedia resolves, which on a cold permission prompt can be seconds — and a
    // reply landing in that window would play into the recording that is about to
    // start. Set here and cleared on every exit path below.
    micIntent = true;

    // Speak the cue BEFORE asking for the mic, not after.
    //
    // Both earlier placements put it on a Bluetooth profile TRANSITION, and that is
    // what mangled it — measured 2026-09-24, the cue arrived "like a cell phone call
    // losing signal". Opening the mic moves the link A2DP → SCO, and audio played
    // while that is negotiating is chopped. Here the link is still on A2DP, stable and
    // high quality, and the cue is instant rather than waiting a second for SCO to
    // settle.
    //
    // Waiting for it to finish also keeps the spoken cue out of the recording, since
    // the mic is not open yet — a bled-in "I'm here" would trip the silence detector's
    // speechSeen flag and send a turn containing only the cue.
    //
    // The cost is a short gap between the cue ending and the mic going live, while SCO
    // comes up. Accepted: people pause after a prompt, and the alternative is a cue
    // that cannot be understood.
    if (headsetMode) {
      await cueAndWait('micOpen', TONE_MIC_OPEN, BUZZ_MIC_OPEN);
      if (!headsetMode) { micIntent = false; return; }   // disarmed while speaking
    }

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      micIntent = false;
      setStatus('Mic blocked: ' + err.name, '#a44');
      document.getElementById('grant-wrap').style.display = 'block';
      return;
    }

    audioChunks = [];
    isRecording = true;
    micBtn.classList.remove('loading');
    micBtn.classList.add('listening');
    micBtn.textContent = 'Tap to Stop';
    setStatus('Recording...', '#4a7');
    hideTranscript();

    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };

    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      stopSilenceDetection();
      isRecording = false;
      micIntent = false;   // recording is over; replies may speak again
      micBtn.classList.remove('listening');
      renderMicIdle();

      // The 120s cap fired. Drop the audio without transcribing it — no /transcribe
      // request, no pipeline turn, no Whisper job. The tone is the only report,
      // because the screen is presumed dark.
      if (discardRecording) {
        discardRecording = false;
        audioChunks = [];
        setStatus('Mic timed out — discarded', '#666');
        cue('timeout', TONE_TIMEOUT, BUZZ_TIMEOUT);
        return;
      }

      // Sounded here rather than at the press, so a turn ended by silence announces
      // itself identically to one ended by a button — on this hardware silence is the
      // usual way a turn ends, and an unannounced send is indistinguishable from a
      // dead mic when the screen is dark.
      // Delayed for the same reason the mic-open cue moved: stopping the recorder
      // releases SCO, and speaking during that hand-back is the other half of the
      // "losing signal" symptom. By the time this fires the link is A2DP again.
      if (headsetMode) setTimeout(() => cue('sent', TONE_SENT, BUZZ_SENT), 700);

      if (audioChunks.length === 0) { setStatus('No audio captured', '#666'); return; }

      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      audioChunks = [];
      // On screen the recording waits in the tray for Send. A headset recording is sent
      // by itself once transcribed: with the screen dark there is nothing to press.
      addSnippet(blob, recordStartedAt, headsetMode, headsetMode ? 'headset' : 'ui');
    };

    mediaRecorder.start();
    recordStartedAt = Date.now();

    // While armed, the press is the only thing that sends (see HEADSET_MAX_RECORD_MS).
    // The cap is the backstop for a second press that never arrives.
    if (headsetMode) {
      maxRecordTimer = setTimeout(() => {
        if (!isRecording) return;
        discardRecording = true;
        stopRecording();
      }, HEADSET_MAX_RECORD_MS);
    }

    // Silence detection: stop automatically after SILENCE_MS of quiet post-speech.
    // Runs while armed too — see the note beside HEADSET_MAX_RECORD_MS for why that
    // reverses the rule an earlier version of this file carried.
    const quietMs = SILENCE_MS;
    try {
      audioCtx = new AudioContext();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      audioCtx.createMediaStreamSource(stream).connect(analyser);
      const buf = new Uint8Array(analyser.frequencyBinCount);
      let speechSeen = false;

      silencePoller = setInterval(() => {
        if (!isRecording) return;
        analyser.getByteFrequencyData(buf);
        const rms = Math.sqrt(buf.reduce((s, v) => s + v * v, 0) / buf.length) / 255;
        if (rms > SILENCE_RMS) {
          speechSeen = true;
          if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
        } else if (speechSeen && !silenceTimer) {
          silenceTimer = setTimeout(() => { if (isRecording) stopRecording(); }, quietMs);
        }
      }, 150);
    } catch {}
  }

  // Mic permission check on load
  const grantWrap = document.getElementById('grant-wrap');
  const grantBtn  = document.getElementById('grant-btn');

  function requestMicPermission() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('Mic unavailable (needs HTTPS)', '#a44');
      grantWrap.style.display = 'block';
      return Promise.resolve();
    }
    return navigator.mediaDevices.getUserMedia({ audio: true })
      .then(s => { s.getTracks().forEach(t => t.stop()); setStatus('Ready', '#555'); grantWrap.style.display = 'none'; })
      .catch(err => { setStatus('Mic blocked: ' + err.name, '#a44'); grantWrap.style.display = 'block'; });
  }
  grantBtn.addEventListener('click', requestMicPermission);
  requestMicPermission();

  micBtn.textContent = 'Tap to Speak';
  micBtn.addEventListener('click', () => {
    if (micBtn.disabled) return;
    if (isRecording) stopRecording(); else startRecording();
  });

  // --- TTS ---

  let audioCtxShared = null;  // single shared AudioContext — resumed on first gesture
  let currentSource = null;   // active BufferSourceNode, so we can stop on interrupt

  // Safari and Android both require a user gesture before audio can play.
  // We resume a shared AudioContext on first tap; all playback goes through it
  // so decodeAudioData/start() are always allowed after this point.
  function unlockAudio() {
    if (audioCtxShared) return;
    try {
      audioCtxShared = new (window.AudioContext || window.webkitAudioContext)();
      audioCtxShared.resume();
    } catch {}
  }
  document.addEventListener('click', unlockAudio, { once: true });
  document.addEventListener('touchend', unlockAudio, { once: true });

  // --- Spoken replies (toggle) ---
  //
  // Off by default. TTS runs behind the reply, so on a slow synthesis the audio was
  // still arriving while the user had already tapped the mic to follow up — speaking
  // over them mid-recording. Making it a toggle rather than removing it keeps voice
  // one tap away without another APK rebuild, which is the whole reason it is a
  // control and not a constant.
  let voiceEnabled = localStorage.getItem('metatron_voice') === 'on';

  function stopSpeaking() {
    if (currentSource) { try { currentSource.stop(); } catch {} currentSource = null; }
    // The catch-path fallback in speakResponse uses the Web Speech API, which has its
    // own queue that stopping the buffer source does not touch.
    try { window.speechSynthesis?.cancel(); } catch {}
  }

  function renderVoiceToggle() {
    const btn = document.getElementById('voice-toggle');
    btn.classList.toggle('on', voiceEnabled);
    btn.textContent = voiceEnabled ? '🔊' : '🔇';
    btn.title = voiceEnabled ? 'Spoken replies on — tap to silence' : 'Spoken replies off — tap to enable';
  }

  document.getElementById('voice-toggle').addEventListener('click', () => {
    voiceEnabled = !voiceEnabled;
    localStorage.setItem('metatron_voice', voiceEnabled ? 'on' : 'off');
    if (!voiceEnabled) stopSpeaking();   // silence what is already playing, not just the next one
    renderVoiceToggle();
  });

  renderVoiceToggle();

  // --- Headset mode: the button on a Bluetooth headset drives the mic ---
  //
  // Armed with one tap, and that tap is load-bearing rather than ceremony. Two
  // things in this page only exist after an in-page gesture: the AudioContext
  // (see unlockAudio above — playTone and speakResponse are both silent without
  // it) and a media session, which a page must own before any platform will
  // deliver it a media-key press. Launching the app is not an in-page gesture,
  // so a headset flow that armed itself would come up with no tones and no
  // spoken reply, and nothing to show why.
  //
  // Arming also BOUNDS THE COST. A headset press starts a full pipeline turn, so
  // a press in a pocket is real money. An unarmed app ignores the button
  // entirely, which is the control the rest of this rests on.
  //
  // Not persisted, deliberately — see armHeadsetMode().

  let lastHeadsetPress = 0;

  function isNative() {
    try { return !!(window.Capacitor && window.Capacitor.isNativePlatform &&
                    window.Capacitor.isNativePlatform()); } catch { return false; }
  }

  // A page with no active media session receives no media keys. This silent loop is
  // what holds one.
  //
  // It MUST be an <audio> element, not Web Audio. The first version used
  // ctx.createBufferSource(), which is inaudible and loops fine but creates no media
  // session at all — the Media Session API is driven by media ELEMENTS, so the anchor
  // was decorative on every platform and the page never owned the button it was
  // supposed to be holding. Found 2026-09-24 while chasing why a second press vanished.
  //
  // No longer gated to non-Capacitor either. It was withheld on Android to avoid
  // competing with the native session in MetatronHeadsetService — but the native
  // session is not reliably up (no notification appears even with notifications
  // granted), and a page that holds the button is strictly better than neither holding
  // it. If both end up live, the 400ms debounce in __metatronHeadsetButton absorbs the
  // double delivery, which is the cheaper failure.
  let headsetAnchor = null;

  // Built at runtime rather than shipped as an asset: no file in the APK, no fetch, and
  // no long base64 literal in this file. A one-second all-zero PCM WAV; the header is
  // written by hand because the sample data is already silence by default.
  function silentWavUrl() {
    const rate = 8000, frames = rate;              // 1s, mono, 16-bit
    const buf = new ArrayBuffer(44 + frames * 2);
    const v = new DataView(buf);
    const tag = (off, str) => {
      for (let i = 0; i < str.length; i++) v.setUint8(off + i, str.charCodeAt(i));
    };
    tag(0, 'RIFF');  v.setUint32(4, 36 + frames * 2, true);  tag(8, 'WAVE');
    tag(12, 'fmt '); v.setUint32(16, 16, true);
    v.setUint16(20, 1, true);                      // PCM
    v.setUint16(22, 1, true);                      // mono
    v.setUint32(24, rate, true);
    v.setUint32(28, rate * 2, true);               // byte rate
    v.setUint16(32, 2, true);                      // block align
    v.setUint16(34, 16, true);                     // bits per sample
    tag(36, 'data'); v.setUint32(40, frames * 2, true);
    return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  }

  function startAnchor() {
    if (headsetAnchor) return;
    try {
      const a = new Audio(silentWavUrl());
      a.loop = true;
      // Deliberately not 0 and not muted. A muted or zero-volume element is exactly the
      // kind of thing a platform may decline to treat as playback — and playback is the
      // whole reason this exists. Inaudible is achieved by the samples being silence.
      a.volume = 0.0001;
      a.play().catch(() => {});
      headsetAnchor = a;
    } catch {}
  }

  function stopAnchor() {
    if (!headsetAnchor) return;
    try {
      headsetAnchor.pause();
      if (headsetAnchor.src) URL.revokeObjectURL(headsetAnchor.src);
      headsetAnchor.src = '';
    } catch {}
    headsetAnchor = null;
  }

  function setMediaHandlers(on) {
    if (!navigator.mediaSession || !navigator.mediaSession.setActionHandler) return;
    // play/pause/stop all route to the same place: one physical button maps to
    // different actions depending on what the platform believes is playing, and
    // guessing which is a bug that only shows up on someone else's headset.
    for (const action of ['play', 'pause', 'stop']) {
      try {
        navigator.mediaSession.setActionHandler(
          action, on ? () => window.__metatronHeadsetButton() : null);
      } catch {}
    }
  }

  function armHeadsetMode() {
    // Native first, and only continue if it actually armed. It refuses when the mic
    // permission was declined — a microphone-typed foreground service cannot start
    // without RECORD_AUDIO — and arming the page anyway would light 🎧 over a button
    // that can never work, with the permission prompt the only visible clue.
    if (isNative()) {
      let started = false;
      try { started = !!(window.Metatron && window.Metatron.arm()); } catch {}
      if (!started) {
        setStatus('Allow the microphone, then tap 🎧 again', '#a44');
        return;
      }
    }

    unlockAudio();
    try { audioCtxShared && audioCtxShared.resume(); } catch {}
    startAnchor();
    setMediaHandlers(true);
    // Spoken replies are off by default, and a headset turn answered silently is a
    // dead end. Forced on for the duration WITHOUT writing localStorage, so the
    // user's own 🔇 preference is still there when they disarm.
    if (!voiceEnabled) { voiceEnabled = true; renderVoiceToggle(); }
    headsetMode = true;
    renderHeadsetToggle();
    // Proves the audio path works BEFORE it is relied on with the screen dark. If
    // this is silent, nothing else in headset mode will be audible either, and
    // finding that out at arming time is the whole point of making it a tap.
    playTone(TONE_ARMED);

    // If the service never reports back, say so rather than showing an armed toggle over
    // nothing. Checked on a timer because the failure is silence, not an error.
    if (isNative()) {
      serviceReady = false;
      setTimeout(() => {
        if (headsetMode && !serviceReady) {
          setStatus('Headset works while the app is open only', '#a80');
        }
      }, 4000);
    }
  }

  function disarmHeadsetMode() {
    // Close an open mic first. Disarming removes the only two things that would ever
    // have ended this recording — the button and the notification — and the silence
    // detector is off while armed, so without this the mic stays live for up to the
    // full 120s cap after the user has been told the feature is off. Discarded, not
    // sent: they were switching it off, not asking a question.
    if (isRecording) {
      discardRecording = true;
      stopRecording();
    }
    headsetMode = false;
    setMediaHandlers(false);
    stopAnchor();
    if (isNative()) { try { window.Metatron && window.Metatron.disarm(); } catch {} }
    // Restore the stored preference rather than leaving voice forced on.
    const stored = localStorage.getItem('metatron_voice') === 'on';
    if (voiceEnabled !== stored) { voiceEnabled = stored; renderVoiceToggle(); }
    renderHeadsetToggle();
  }

  // The single entry point. Called by the mediaSession handlers above and, on
  // Android, by MetatronHeadsetService via evaluateJavascript — which is why it
  // hangs off window rather than being a local.
  // Returns true when this page took responsibility for the press. The Android
  // service reads that value back and stops itself on false — so returning false
  // while unarmed is what resolves a service that has outlived the page that armed
  // it, rather than leaving a live notification over a dead button.
  window.__metatronHeadsetButton = function () {
    if (!headsetMode) return false;

    // Bluetooth stacks routinely deliver one press as two events (down and up).
    // Undebounced, that opens the mic and closes it again in the same instant.
    // Still "handled": it is the same press, not a lost one.
    const now = Date.now();
    if (now - lastHeadsetPress < 400) return true;
    lastHeadsetPress = now;

    // A press while an earlier recording is still being transcribed is fine now:
    // recordings queue in the tray and go to /transcribe one at a time (pumpTranscription),
    // so the single-slot semaphore there never sees the overlap.

    if (isRecording) {
      stopRecording();   // the tone is sounded in onstop, which silence also reaches
    } else {
      // No tone here. startRecording() awaits getUserMedia — and, once Bluetooth
      // SCO routing lands, a profile switch of up to a second — so a tone fired
      // now would say "speak" before the mic exists and the first words would be
      // lost. It is played inside startRecording() once the recorder is running.
      startRecording();
    }
    return true;
  };

  // Called by the service once startForeground has actually succeeded — or failed.
  //
  // Without this the page cannot tell a running service from one that died on startup:
  // arm() returns as soon as startForegroundService() is called, so the tone and the lit
  // toggle mean only "the request was made". Background operation is the half that needs
  // the service; the button still works while the app is open, via the media session the
  // page holds itself, so a failure here is a reduced feature rather than none.
  let serviceReady = false;
  window.__metatronServiceReady = function (ok) {
    serviceReady = !!ok;
    if (!ok) setStatus('Headset works while the app is open only', '#a80');
  };

  // Called by the service when the notification's Stop action is used, so the page
  // and the service never disagree about whether the button is live.
  window.__metatronDisarm = function () {
    if (headsetMode) disarmHeadsetMode();
  };

  function renderHeadsetToggle() {
    const btn = document.getElementById('headset-toggle');
    btn.classList.toggle('on', headsetMode);
    btn.title = headsetMode
      ? 'Headset button is live — tap to release it'
      : 'Headset button off — tap to control Metatron from your headphones';
  }

  document.getElementById('headset-toggle').addEventListener('click', () => {
    if (headsetMode) disarmHeadsetMode(); else armHeadsetMode();
  });

  renderHeadsetToggle();

  // --- New-message alerts ---
  //
  // A reply lands tens of seconds after it is asked for — the wait is dominated by
  // thinking, not delivery — so the phone is usually back in a pocket by the time
  // it arrives. Three settings rather than one: when to alert, and whether each of
  // sound and vibration is used, because "tell me about everything" and "tell me
  // only when I'm away" are different needs, and on a phone in a meeting the right
  // answer is vibration without sound.

  const ALERT_SCOPES = ['always', 'hidden', 'proactive', 'off'];

  let alertScope   = localStorage.getItem('metatron_alert_scope') || 'always';
  let alertSound   = localStorage.getItem('metatron_alert_sound')   !== 'off';   // default on
  let alertVibrate = localStorage.getItem('metatron_alert_vibrate') !== 'off';   // default on
  if (!ALERT_SCOPES.includes(alertScope)) alertScope = 'always';

  // Built from an oscillator rather than a bundled sound file: no asset to ship in
  // the APK, no fetch, no decode, and it plays through the same AudioContext the
  // spoken-reply path already unlocks on the first tap. It cannot play before that
  // first tap — which is the reason vibration is a separate toggle rather than a
  // detail of this one.
  //
  // Four events now share this, and in headset mode the screen is dark, so they must
  // be told apart BY EAR alone. The reply ping is unchanged (rising, two notes); the
  // three headset cues are single notes at distinct pitches, low to high in the order
  // a turn actually happens, with the timeout deliberately below all of them.
  const TONE_REPLY    = [880, 1174.66]; // A5→D6 rising — a reply landed (unchanged)
  const TONE_ARMED    = [440, 659.25];  // A4→E5 rising — headset mode is live
  const TONE_MIC_OPEN = [523.25];       // C5  — mic is live, speak now
  const TONE_SENT     = [783.99];       // G5  — turn sent, Metatron is thinking
  const TONE_TIMEOUT  = [329.63];       // E4  — mic capped and DISCARDED, nothing sent

  // Vibration patterns paired with the tones above, and NOT a redundant nicety.
  //
  // The mic-open cue is inaudible on a Bluetooth headset, always. Opening the mic
  // switches the link from A2DP to SCO (call mode), and Web Audio plays on the MEDIA
  // stream, which is not routed to the headset while SCO holds it — so the tone is
  // played into a channel the ears are not connected to. Measured 2026-09-24: the only
  // sign the mic had opened was the SCO hiss.
  //
  // Vibration is routed by the phone, not the headset, so it is unaffected by the
  // profile switch — and the phone is in a pocket for this feature, which is exactly
  // where a vibration is easiest to feel. The tones stay for the browser path and for
  // the cues that land after SCO releases.
  const BUZZ_MIC_OPEN = [60];            // one short  — mic is live, speak now
  const BUZZ_SENT     = [40, 80, 40];    // two short  — turn sent
  const BUZZ_TIMEOUT  = [200];           // one long   — capped and discarded

  // Off by default, and a setting rather than the mechanism: Mike's call, 2026-09-24 —
  // the cue should be a tone, with vibration available for anyone who wants it.
  let headsetVibrate = localStorage.getItem('metatron_headset_vibrate') === 'on';

  function buzz(pattern) {
    if (!headsetVibrate) return;
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch {}
  }

  // One call per headset event, because the right mechanism differs by platform.
  //
  // On Android the tone MUST come from native code: Web Audio plays on the media
  // stream, and SCO (call mode, engaged the moment the mic opens) does not carry it,
  // so a Web Audio cue is inaudible on a headset exactly when it matters. playCue()
  // picks STREAM_VOICE_CALL when a headset is in call mode and the media stream
  // otherwise. In a browser there is no bridge, and playTone is all there is.
  // Resolved by the native side when the spoken cue has finished.
  let cueDoneResolve = null;
  window.__metatronCueDone = function () {
    if (cueDoneResolve) { const r = cueDoneResolve; cueDoneResolve = null; r(); }
  };

  // Sound the cue and wait for it to finish. The waiting is the point, not politeness:
  // the mic-open cue is SPOKEN, and speech played into an already-open mic is exactly
  // what the transcriber is tuned to catch. A bled-in "I'm here" would also set the
  // silence detector's speechSeen flag, so a turn in which the user said nothing would
  // send itself carrying only the cue. Starting the recorder after the cue removes the
  // possibility rather than relying on the headset's echo cancellation to hide it.
  function cueAndWait(kind, freqs, pattern) {
    cue(kind, freqs, pattern);
    if (!isNative()) return Promise.resolve();
    return new Promise((resolve) => {
      cueDoneResolve = resolve;
      // Never block the mic on a callback that may not come — a missing TTS engine or a
      // killed utterance must cost a short pause, not the turn.
      setTimeout(() => {
        if (cueDoneResolve) { cueDoneResolve = null; resolve(); }
      }, 2500);
    });
  }

  function cue(kind, freqs, pattern) {
    let native = false;
    if (isNative()) {
      try {
        if (window.Metatron && window.Metatron.playCue) {
          window.Metatron.playCue(kind);
          native = true;
        }
      } catch {}
    }
    if (!native) playTone(freqs);
    buzz(pattern);
  }

  function playTone(freqs) {
    if (!audioCtxShared) return;
    try {
      const ctx = audioCtxShared;
      ctx.resume();
      const now = ctx.currentTime;

      const gain = ctx.createGain();
      gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.16, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.32);

      const osc = ctx.createOscillator();
      osc.type = 'sine';
      freqs.forEach((f, i) => osc.frequency.setValueAtTime(f, now + i * 0.09));
      osc.connect(gain);
      osc.start(now);
      osc.stop(now + 0.34);
    } catch {}
  }

  function playPing() { playTone(TONE_REPLY); }

  function vibrateAlert() {
    // Absent on desktop and in some WebViews, where it is a silent no-op — which is
    // the other half of why sound and vibration are toggled independently.
    try { if (navigator.vibrate) navigator.vibrate([40, 60, 40]); } catch {}
  }

  // isProactive: true when Metatron opened the exchange rather than answering the user.
  function maybeAlert(isProactive) {
    if (alertScope === 'off') return;
    if (alertScope === 'hidden' && document.visibilityState === 'visible') return;
    if (alertScope === 'proactive' && !isProactive) return;
    // A beep into an open mic is the same failure spoken replies already guard
    // against — it would be recorded as if the user had said it.
    if (alertSound && !isRecording && !micIntent) playPing();
    if (alertVibrate) vibrateAlert();
  }

  function renderAlertControls() {
    const btn = document.getElementById('alert-toggle');
    const live = alertScope !== 'off' && (alertSound || alertVibrate);
    btn.classList.toggle('on', live);
    btn.textContent = live ? '🔔' : '🔕';
    document.getElementById('alert-scope').value = alertScope;
    document.getElementById('alert-sound').checked = alertSound;
    document.getElementById('alert-vibrate').checked = alertVibrate;
    document.getElementById('alert-note').textContent =
      alertScope === 'hidden' ? 'Silent while this screen is in front of you.'
      : alertScope === 'proactive' ? 'Silent for replies to your own messages.'
      : alertScope === 'off' ? 'No alerts.'
      : 'Alerts on every message that arrives.';
  }

  document.getElementById('alert-toggle').addEventListener('click', () => {
    document.getElementById('alert-settings').classList.toggle('shown');
  });

  document.getElementById('alert-scope').addEventListener('change', (e) => {
    alertScope = e.target.value;
    localStorage.setItem('metatron_alert_scope', alertScope);
    renderAlertControls();
  });

  // Changing a switch previews what it does. Otherwise the only way to find out
  // whether the ping is audible on this device is to send a message and wait out
  // the reply — and a setting that cannot be tested is one that gets left alone.
  document.getElementById('alert-sound').addEventListener('change', (e) => {
    alertSound = e.target.checked;
    localStorage.setItem('metatron_alert_sound', alertSound ? 'on' : 'off');
    if (alertSound) playPing();
    renderAlertControls();
  });

  document.getElementById('alert-vibrate').addEventListener('change', (e) => {
    alertVibrate = e.target.checked;
    localStorage.setItem('metatron_alert_vibrate', alertVibrate ? 'on' : 'off');
    if (alertVibrate) vibrateAlert();
    renderAlertControls();
  });

  {
    const hv = document.getElementById('headset-vibrate');
    hv.checked = headsetVibrate;
    hv.addEventListener('change', (e) => {
      headsetVibrate = e.target.checked;
      localStorage.setItem('metatron_headset_vibrate', headsetVibrate ? 'on' : 'off');
      // Preview it, same reasoning as the alert switches above: a setting you cannot
      // test without staging a whole turn is a setting that gets left alone.
      if (headsetVibrate) { try { navigator.vibrate && navigator.vibrate(BUZZ_MIC_OPEN); } catch {} }
    });
  }

  renderAlertControls();

  // Shown so "did that reinstall actually take?" is answerable by looking, not by
  // trusting the sideload steps were followed in the right order.
  {
    const el = document.getElementById('build-stamp');
    let stamp = '';
    try { if (window.Metatron && window.Metatron.buildStamp) stamp = window.Metatron.buildStamp(); } catch {}
    el.textContent = stamp ? ('Installed ' + stamp) : '';
  }

  // --- Location [DB-0815-12] ---
  //
  // Two capture modes, and both are a thing the user did: a switch that attaches a reading
  // to a message they are already sending, and a button that shares one on the spot. Both
  // use the ordinary "while using the app" permission. There is no background tracking, no
  // timer and no watchPosition — the later build that adds scheduled pings needs the
  // "allow all the time" permission and a persistent notification, and is deliberately not
  // here.
  //
  // THE SWITCH IS OFF UNTIL IT IS TURNED ON. The stored value must be exactly 'on'; every
  // other state of the world — never set, cleared, corrupted, some other string — is off.
  // This is not the same as `!== 'off'` (the pattern the alert switches use, where the
  // default is on) and the difference is the whole feature: a location default that could
  // be arrived at by accident is a location default that is wrong. tests/test_location_
  // onsend_default.js runs this exact code against a fresh localStorage.
  //
  // The coordinate goes to POST /location and nowhere else. It is not attached to the
  // message, so it never travels through the conversation; the server maps it to a named
  // place and throws it away. That is why this is fire-and-forget and why a failure is
  // silent for the on-send path: the message is the thing the user asked for, and it must
  // not wait on, or be lost to, a GPS fix.
  const LOC_ONSEND_KEY = 'metatron_location_onsend';

  let locOnSend = localStorage.getItem(LOC_ONSEND_KEY) === 'on';

  // Long enough for a cold fix outdoors, short enough that the button does not look
  // hung. A cached fix up to a minute old is accepted: the zones this resolves to are
  // hundreds of metres across, so a fresh reading buys nothing but battery and delay.
  const LOC_TIMEOUT_MS = 15000;
  const LOC_MAX_AGE_MS = 60000;

  function readPosition() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) { reject(new Error('unsupported')); return; }
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve(pos),
        (err) => reject(err),
        { enableHighAccuracy: false, timeout: LOC_TIMEOUT_MS, maximumAge: LOC_MAX_AGE_MS },
      );
    });
  }

  async function postLocation(pos) {
    const res = await authFetch('/location', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        lat: pos.coords.latitude,
        lon: pos.coords.longitude,
        accuracy: pos.coords.accuracy,
        ts: new Date(pos.timestamp || Date.now()).toISOString(),
        persona: currentPersona,
      }),
    });
    if (!res.ok) throw new Error('rejected');
    return res.json();
  }

  // Attached to a message the user is sending, when they have switched that on. Returns
  // immediately — nothing about sending waits for this.
  function maybeSendLocationWithMessage() {
    if (!locOnSend) return;
    readPosition().then(postLocation).catch(() => {});
  }

  // The button. Unlike the on-send path this reports what happened, because the user
  // asked for it and a silent no-op reads as a broken button — which is also the only
  // place they will find out that the permission prompt was declined.
  async function shareLocationNow() {
    const btn = document.getElementById('loc-share-btn');
    const note = document.getElementById('loc-note');
    if (btn) btn.disabled = true;
    if (note) note.textContent = 'Checking where you are...';
    try {
      const result = await postLocation(await readPosition());
      const zone = (result && result.zone) || 'somewhere unnamed';
      if (note) {
        note.textContent = zone === 'away'
          ? "Shared — that spot isn't one of your named places."
          : `Shared — you're at ${zone}.`;
      }
    } catch (e) {
      if (note) note.textContent = 'Could not get a location fix.';
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  function renderLocControls() {
    const btn = document.getElementById('loc-toggle');
    if (btn) btn.classList.toggle('on', locOnSend);
    const box = document.getElementById('loc-onsend');
    if (box) box.checked = locOnSend;
    const note = document.getElementById('loc-note');
    if (note) {
      note.textContent = locOnSend
        ? 'Sent with your messages, while the app is open. Nothing is tracked in the background.'
        : 'Off. Location is only sent if you switch this on or tap the button.';
    }
  }

  document.getElementById('loc-toggle').addEventListener('click', () => {
    document.getElementById('loc-settings').classList.toggle('shown');
  });

  document.getElementById('loc-onsend').addEventListener('change', (e) => {
    locOnSend = e.target.checked;
    localStorage.setItem(LOC_ONSEND_KEY, locOnSend ? 'on' : 'off');
    renderLocControls();
  });

  document.getElementById('loc-share-btn').addEventListener('click', shareLocationNow);

  renderLocControls();
  // --- end location ---

  // Silence is checked at every point where playback could begin, not only on entry.
  //
  // The reported failure was a *delayed* reply talking over a recording, and the delay
  // is the await on /tts below — several seconds of synthesis. Checking only at the top
  // of this function, or only calling stopSpeaking() when recording starts, both miss
  // the case that actually happens: the mic opens while the TTS request is still in
  // flight, and the audio arrives afterwards with nothing left to stop it.
  //
  // Late audio is discarded rather than queued. A spoken answer to the message before
  // last, played after the user has moved on, is worse than silence.
  function speechBlocked() {
    return !voiceEnabled || isRecording || micIntent;
  }

  async function speakResponse(text) {
    if (speechBlocked()) return;
    stopSpeaking();
    try {
      const res = await authFetch('/tts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      if (!res.ok) throw new Error('TTS failed');
      const arrayBuffer = await res.arrayBuffer();
      if (speechBlocked()) return;            // mic opened while /tts was synthesising
      if (!audioCtxShared) unlockAudio();
      await audioCtxShared.resume();
      const audioBuffer = await audioCtxShared.decodeAudioData(arrayBuffer);
      if (speechBlocked()) return;            // and again after decode, which also awaits
      const source = audioCtxShared.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(audioCtxShared.destination);
      currentSource = source;
      source.onended = () => { if (currentSource === source) currentSource = null; };
      source.start(0);
    } catch {
      if (speechBlocked()) return;            // the fallback path can talk over you too
      const utt = new SpeechSynthesisUtterance(text);
      utt.rate = 0.95;
      window.speechSynthesis?.speak(utt);
    }
  }

  // --- Web Push registration ---

  async function subscribePush(reg) {
    const keyRes = await authFetch('/vapid-public-key');
    const { publicKey } = await keyRes.json();
    if (!publicKey) return;
    const padding = '='.repeat((4 - publicKey.length % 4) % 4);
    const base64 = (publicKey + padding).replace(/-/g, '+').replace(/_/g, '/');
    const raw = Uint8Array.from(atob(base64), c => c.charCodeAt(0));

    // Unsubscribe any existing subscription — key may have rotated
    const existing = await reg.pushManager.getSubscription();
    if (existing) await existing.unsubscribe();

    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: raw,
    });
    await authFetch('/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(sub.toJSON()),
    });
    return sub;
  }

  // Set at startup by the unconditional registration at the bottom of this script.
  let swRegistration = null;

  async function initPush() {
    const wrap = document.getElementById('notif-wrap');
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
      wrap.innerHTML = '<span style="color:#333;font-size:11px">push-unsupported</span>';
      return;
    }
    const perm = Notification.permission;

    if (perm === 'denied') {
      wrap.innerHTML = '<span style="color:#333;font-size:11px">notif blocked — enable in Chrome site settings</span>';
      return;
    }

    if (perm !== 'granted') {
      // Show button immediately — don't wait for SW registration
      wrap.innerHTML = '<button id="notif-btn" style="background:#1a1a1a;border:1px solid #333;border-radius:20px;color:#666;font-size:12px;padding:6px 16px;cursor:pointer">Enable notifications</button>';
      document.getElementById('notif-btn').addEventListener('click', async () => {
        try {
          const result = await Notification.requestPermission();
          if (result === 'granted') {
            wrap.innerHTML = '<span style="color:#444;font-size:12px">Notifications on — setting up...</span>';
            await swRegistration;   // rejects if startup registration failed
            const reg = await navigator.serviceWorker.ready;
            await subscribePush(reg);
            wrap.innerHTML = '<span style="color:#444;font-size:12px">Notifications on</span>';
          } else {
            wrap.innerHTML = '<span style="color:#333;font-size:12px">Notifications blocked</span>';
          }
        } catch(e) {
          wrap.innerHTML = `<span style="color:#333;font-size:11px">notif error: ${e.message}</span>`;
          console.warn('Push setup failed:', e);
        }
      });
      return;
    }

    // Already granted — subscribe silently against the startup registration
    try {
      await swRegistration;   // rejects if startup registration failed
      const reg = await navigator.serviceWorker.ready;
      await subscribePush(reg);
      wrap.innerHTML = '<span style="color:#444;font-size:12px">Notifications on</span>';
    } catch(e) { console.warn('Push subscribe failed:', e); }
  }

  // --- Text input ---

  // --- Approval of irreversible actions ---
  //
  // The model may propose; only this can approve. The token it holds is inert until the
  // server records a tap here, so a model talked into acting by a hostile email still
  // cannot proceed — which is the case the whole mechanism exists for.
  //
  // Polled rather than pushed: a missed push would silently strand an action, and the
  // call is small. Stops while the login screen is up.
  let pendingToken = null;

  async function refreshPending() {
    if (!currentPersona || !authToken) return;
    try {
      const res = await authFetch('/pending-confirmations?persona=' + encodeURIComponent(currentPersona));
      if (!res.ok) return;
      const { pending } = await res.json();
      const bar = document.getElementById('confirm-bar');
      if (!pending || !pending.length) {
        pendingToken = null;
        bar.classList.remove('shown');
        return;
      }
      const item = pending[0];   // one at a time — stacked approvals invite mis-taps
      pendingToken = item.token;
      document.getElementById('confirm-text').textContent = item.description;
      document.getElementById('confirm-yes').disabled = false;
      bar.classList.add('shown');
    } catch (e) { /* offline or signed out — the poll retries */ }
  }

  document.getElementById('confirm-yes').addEventListener('click', async () => {
    if (!pendingToken) return;
    const btn = document.getElementById('confirm-yes');
    btn.disabled = true;
    try {
      const res = await authFetch('/confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: pendingToken, persona: currentPersona }),
      });
      if (!res.ok) { setStatus('Could not record approval', '#a44'); btn.disabled = false; return; }
      document.getElementById('confirm-bar').classList.remove('shown');
      pendingToken = null;
      // The server carries the action out and broadcasts the outcome as an ordinary
      // exchange, so it arrives over the socket like any other message — nothing to
      // render here. This used to nudge the pipeline instead ("Approved — go ahead."),
      // hoping the model would retry with the token it held. It never could: the token
      // came back inside a tool result and is gone from its context by the next turn,
      // so the approval expired unspent and the reply said it was still waiting.
      // [DB-0815-03].
    } catch (e) {
      setStatus('Could not record approval', '#a44');
      btn.disabled = false;
    }
  });

  document.getElementById('confirm-no').addEventListener('click', async () => {
    if (!pendingToken) return;
    const btn = document.getElementById('confirm-no');
    // This used to make no server call at all — "an unapproved request simply expires".
    // It does expire, in ten minutes, and the five-second poll re-showed the same card
    // the whole way there, so the only way out of the loop was to approve. A gate whose
    // cheapest escape is consent is not a gate. [DB-0827-01].
    btn.disabled = true;
    try {
      const res = await authFetch('/decline', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: pendingToken, persona: currentPersona }),
      });
      // Leaving the card up on failure is the honest outcome: the record is still pending
      // server-side, and dismissing it here would put us back to exactly the bug — a "No"
      // the user believes landed and that nothing acted on.
      if (!res.ok) { setStatus('Could not record decline', '#a44'); btn.disabled = false; return; }
      document.getElementById('confirm-bar').classList.remove('shown');
      pendingToken = null;
      btn.disabled = false;
      // The server records the refusal and broadcasts it as an ordinary exchange, so it
      // arrives over the socket like any other message — nothing to render here.
    } catch (e) {
      setStatus('Could not record decline', '#a44');
      btn.disabled = false;
    }
  });

  setInterval(refreshPending, 5000);

  function submitText() {
    const text = textField.value.trim();
    const ready = snippets.filter(sn => !sn.auto && sn.state === 'ready');
    // A photograph with no words is a complete message — "look at this" is implied
    // by the act of attaching it.
    if (!text && !ready.length && !readyAttachments().length) return;
    if (uploadsPending()) { setStatus('Still attaching…', '#888'); return; }
    // The whole batch or nothing: sending the ready half would split one message in two,
    // with the rest arriving later as a reply to an answer that has not happened yet.
    const unready = snippets.filter(sn => !sn.auto && (sn.state === 'pending'
      || sn.state === 'transcribing' || sn.state === 'waiting')).length;
    if (unready) {
      setStatus(unready === 1 ? 'A recording is not transcribed yet'
                              : `${unready} recordings are not transcribed yet`, '#888');
      return;
    }
    const input = composeBatch(ready, text);
    textField.value = '';
    saveDraft();
    snippets = snippets.filter(sn => !ready.includes(sn));
    saveSnippets();
    renderTray();
    sendToServer(input);
  }

  // What is typed but not yet sent survives the app being closed — Android kills a
  // backgrounded WebView without warning, and a half-written message went with it.
  function draftKey() { return 'metatron_draft_' + currentPersona; }
  function saveDraft() {
    try {
      if (textField.value) localStorage.setItem(draftKey(), textField.value);
      else localStorage.removeItem(draftKey());
    } catch {}
  }
  function restoreDraft() {
    try { textField.value = localStorage.getItem(draftKey()) || ''; } catch {}
  }
  textField.addEventListener('input', saveDraft);

  sendBtn.addEventListener('click', submitText);
  textField.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitText(); }
  });


  // Register the service worker unconditionally, before and independently of login.
  // This is what installs the offline shell: without a registered worker there is no
  // fetch handler, so a phone that cannot reach the server falls back to the browser's
  // own error page. Registration used to happen only inside initPush(), gated on
  // PushManager support and notification permission — so a user who declined
  // notifications, or a WebView with no PushManager, never got a shell.
  //
  // initPush() no longer registers; it awaits navigator.serviceWorker.ready and uses
  // that registration. Registering the same URL twice is a no-op per spec, but having
  // one owner of the registration keeps the push UI and the offline shell independent.
  if ('serviceWorker' in navigator) {
    swRegistration = navigator.serviceWorker.register('/sw.js');
    // Logged on a derived promise so the original still rejects for initPush to
    // catch — awaiting .ready alone would hang forever if registration failed.
    swRegistration.catch((e) => console.warn('Service worker registration failed:', e));
  }

  // Auto-login if persona saved — must run after all variables and handlers are initialized
  const savedPersona = localStorage.getItem('metatron_persona');
  if (savedPersona) {
    document.getElementById('login-persona-select').value = savedPersona;
  }
  // Auto-enter only with a token in hand. Without one every call would 401 and bounce
  // straight back here, so the login screen is the honest starting point. The token
  // outlives a restart (it is signed, not stored server-side), so this is still the
  // usual path — the user is not asked for a password on every app open.
  if (savedPersona && authToken) {
    enterApp(savedPersona);
  }
</script>
</body>
</html>
