<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Life Manager</title>
  <!-- Self-contained by requirement: this page renders when nothing on the
       network is reachable, so every style is inline and there is not a single
       external reference (no font, no icon, no script src). -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0d0d;
      color: #e8e8e8;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px 20px 12px;
      font-size: 13px;
      color: #666;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-bottom: 1px solid #1a1a1a;
    }

    main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px 28px 64px;
      text-align: center;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    p {
      font-size: 16px;
      line-height: 1.5;
      color: #9a9a9a;
      max-width: 30ch;
    }

    button {
      margin-top: 6px;
      padding: 13px 30px;
      font-family: inherit;
      font-size: 16px;
      color: #e8e8e8;
      background: #1e3a5f;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:active { background: #24466f; }
  </style>
</head>
<body>
  <header>Life Manager</header>
  <main>
    <h1>Can't reach you right now</h1>
    <p>No connection. Your messages are safe — try again in a moment.</p>
    <button type="button" id="retry">Try again</button>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', function () {
      location.reload();
    });
  </script>
</body>
</html>
