# Model routing configuration — LOCAL (Ollama) mode
#
# ⚠ BEFORE USING THIS ON THE MAC: activate always-on provisions first:
#   1. sudo pmset -a sleep 0 disksleep 0
#   2. launchctl load ~/Library/LaunchAgents/com.metatron.server.plist
#      (create plist first if needed — see archive/sessions/2026-06-20 — VM Provisioning, GitHub, Deploy Pipeline.md)
#
# All agents with personal context are local: true — they route to Ollama only.
# Ollama unavailable → hard error (fail-closed). No cloud fallbacks for sensitive agents.
#
# complexity="quick" does NOT override local: true agents — sensitivity beats speed.
# quick_override applies only to non-sensitive agents (currently: research_agent).
#
# research_agent is the only cloud-routed agent; it receives only decontextualized requests.
#
# allowed_tools: per-agent schema whitelist. Only these tool schemas are sent to the LLM.
# All Python functions remain registered in register_tools(); schemas for unlisted tools
# are simply not advertised. Omit the field to pass all schemas (default / bare agents).

local_enabled: true

local:
  endpoint: "http://localhost:11434/v1"
  model: "qwen3:14b"

# System-level override for complexity="quick" calls on non-sensitive agents only.
quick_override:
  provider: gemini
  model: "models/gemini-3.1-flash-lite"

# Agent model assignments.
# local: true  → Ollama only; fail-closed if Ollama is down.
# provider/model → cloud; only permitted for decontextualized agents.
agents:

  # ── Head layer (local: carries Tier 1–3 context in every session) ───────────

  coordinator:
    local: true
    allowed_tools: []

  synthesizer:
    local: true
    allowed_tools: [run_subagent, run_model_conference, write_persona, write_profile, read_profile, write_config, write_wishes, read_wishes, generate_emergency_card, write_quality_event, write_schedule, list_schedules, delete_schedule, update_goal, open_obligation, close_obligation, reopen_obligation, list_obligations]

  # ── Data and analysis (local: reads/writes personal logs) ───────────────────

  diarist:
    local: true
    # Parity with routing_cloud.yaml. The 2026-07-27 fix (commit 814e6c3) added
    # write_log and write_wisdom to the cloud config and missed this one, so the
    # Diarist silently lost both whenever DEPLOYMENT_MODE was local.
    allowed_tools: [write_journal, write_archive, write_log, write_wisdom]

  pattern_miner:
    local: true
    allowed_tools: [get_log_window, write_insight_report, read_recent_insights, write_baseline_period, read_baseline_periods, write_retrospective, get_baseline_context, create_semantic_anchor, shuffled_null_score, score_against_anchors]

  goals_interviewer:
    local: true
    allowed_tools: [read_goals, write_goals, write_config, write_retrospective, create_semantic_anchor, write_aspirational_baseline, update_goal]

  # ── Personal specialists (local: sensitive — named individuals, health, finance) ─

  mental_wellbeing:
    local: true
    allowed_tools: [read_log, write_log, write_journal, search_memory, read_agent_config, write_agent_config, read_wisdom, write_wisdom]

  physical_health:
    local: true
    # read_agent_config granted 2026-08-04, write_agent_config 2026-08-05 (medication_profile
    # guarded in Python) — see routing_cloud.yaml for the rationale.
    # Kept in parity so the flag behaves identically on local and cloud paths.
    allowed_tools: [read_log, write_log, search_memory, read_wisdom, write_wisdom, read_profile, write_profile, read_agent_config, write_agent_config]

  work_vocation:
    local: true
    # search_memory granted 2026-08-05 — see routing_cloud.yaml. Kept in parity.
    allowed_tools: [read_log, write_log, read_agent_config, write_agent_config, read_profile, write_profile, search_memory]

  relationships:
    local: true
    # search_memory granted 2026-08-10 — see routing_cloud.yaml. Kept in parity.
    allowed_tools: [read_log, write_log, write_journal, write_contact, read_contact, list_contacts, log_interaction, search_contacts, read_profile, write_profile, send_email, search_memory]

  finance:
    local: true
    # read_archive granted 2026-08-05, search_memory 2026-08-10 — see routing_cloud.yaml.
    # Kept in parity.
    allowed_tools: [read_log, write_log, read_agent_config, write_agent_config, read_profile, write_profile, read_archive, open_obligation, close_obligation, reopen_obligation, list_obligations, search_memory]

  learning_growth:
    local: true
    allowed_tools: [read_log, write_log, search_memory, read_agent_config, write_agent_config]

  recreation_hobbies:
    local: true
    allowed_tools: [read_log, write_log]

  logistics:
    local: true
    allowed_tools: [read_log, write_log, read_calendar, write_calendar_event, update_calendar_event, delete_calendar_event, check_calendar_conflicts, get_weather, get_tfl_status, get_flight_status, get_travel_time, get_regional_transit_info, read_profile, write_profile, write_schedule, list_schedules, delete_schedule, fetch_url, read_email, read_agent_config, write_agent_config, search_memory, read_archive, write_archive, open_obligation, close_obligation, reopen_obligation, list_obligations]
    # read/write_agent_config, search_memory, read/write_archive granted 2026-08-05 — see
    # routing_cloud.yaml for the full rationale. Kept in parity.
    # update_calendar_event, delete_calendar_event, check_calendar_conflicts added
    # 2026-08-05 — see routing_cloud.yaml for the full rationale. Kept in parity.
    # fetch_url + read_email added 2026-08-04. Granted here and not more widely:
    # both return content written by strangers, so the blast radius of an injected
    # instruction is the holder's toolset. Logistics is the agent that actually needs
    # them (bookings, confirmations, invitations). research_agent already reaches them
    # because it omits allowed_tools entirely, which means all tools — see the note in
    # DEV_BACKLOG.md. Widen only on a logged denial, per standing practice.

  # ── Cloud-only (decontextualized — no personal context ever passed) ──────────

  research_agent:
    provider: gemini
    model: "models/gemini-3.1-pro-preview"   # grounded search; decontextualized only
    allowed_tools: [fetch_url, get_pollen_forecast]
    # get_pollen_forecast added 2026-08-08. It is the data source for the pollen leg of
    # the routing coordinator.md already carried ("sore throat" → Physical Health →
    # Research (pollen?) → Logistics). Decontextualized by construction: a city name goes
    # out, an index comes back, no personal context is involved.
    # Explicit list as of 2026-08-04, and the wording it replaced was misleading:
    # "no allowed_tools — bare mode (no personal tools)" conflated two different
    # things. Bare mode (orchestrator `_run_single_agent`) withholds personal
    # *context*; omitting allowed_tools grants *all* tools (`None` = allow all in
    # core/router.py). It read as the most restrictive setting and was the least.
    # Harmless while the grounded path passed no tools at all — but that changed
    # the same day, so the list is now real. fetch_url only: Research reads pages,
    # it writes nothing.
