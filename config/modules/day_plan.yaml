# config/modules/day_plan.yaml — the day planner's switches and tuning knobs.
#
# Plan: archive/plans/day_planner_plan_2026-10-24.md. Read by tools/day_plan_config.py, which
# re-reads this file whenever it changes on disk, so a flag flip needs no restart.
#
# STAGE A (built 2026-10-24) ships with only `build` and `show_in_app` on. Everything a model
# would see — new tool actions, the plan block, its conduct module — stays off until the one Red
# session (Stage B) reviews the conduct text and flips the rest. Deployed in this state, nothing
# Synth sees or does changes (plan § 10).
#
# STAGE B, step 1 (2026-10-27, after the smoke test passed 3/3): ledger_fields, synth_reads_plan,
# unconfirmed_rule and reshuffle_model on. nudges and owns_checkins wait for Stage C (push with
# the app closed — Mike's D1) and a day of plan-reading that looks right.
#
# STEP 2 (2026-10-29, Mike): nudges and owns_checkins on, after Stage C went live (VM 32115b6).
# Mike's live check-in job is `companion_checkin`, read on the VM the same day — replaces_jobs
# is unchanged. Turning either flag off restores the fixed check-ins exactly.

flags:
  # Build and keep the day's plan (code only until reshuffle_model is on).
  build: true
  # Show the plan in the app's Today panel — the testing view (Mike, Q1: "for now while we're
  # building/testing, to move to (a) when done"). Turning this off is the move to (a).
  show_in_app: true
  # Expose the ledger's new task actions and fields (link_goal, set_priority, set_stakes,
  # set_zone, day_starts) and update_goal's `essential` in the schemas models see. Off in Stage A
  # on purpose (review R1-1): a schema's description is in the prompt of every agent granted it.
  ledger_fields: true
  # Put the plan block in the Synthesizer's package and inject its conduct module.
  synth_reads_plan: true
  # F10: non-essential habits end a period `unconfirmed` (not `missed`), and missable deadlines
  # past their date show as `lapsed`, not overdue.
  unconfirmed_rule: true
  # Refine the code plan with the day_planner model on reshuffle (needs the Stage B agent file).
  reshuffle_model: true
  # Wake Synth at plan-marked nudge and check points (needs the Stage B scheduler job).
  nudges: true
  # The plan's empty-day check-ins replace the jobs listed in `replaces_jobs`.
  owns_checkins: true
  # GOAL–TASK NETWORK PHASE 1 (2026-11-18; archive/plans/goal_task_network_plan_2026-11-18.md).
  # A horizon finding's precursor ("gather the Red Book before Betty's 09:30 session") becomes a
  # task the plan places, nudges and checks, and that follows its event (§ 10 R2). Off closes the
  # open ones with a reason, and the precursor is said again under Important, as before (A3).
  prep_tasks: true
  # New horizon findings share Important's cap (`important_max`) on the brief and close, and take
  # at most one slot on an ordinary turn; one held back keeps its offers (§ 12 M2, Mike's yes
  # 2026-11-18). Off: every undelivered finding arrives at once, as before.
  horizon_cap: true
  # GOAL–TASK NETWORK PHASE 2 (2026-11-21). A goal or obligation Synth sized M and checked with
  # the user is queued (plan_project) and broken into small dated steps by the project_planner
  # agent, run off this tick — one at a time, capped per day (limits below). Off: plan_project
  # refuses, nothing is queued or planned, and steps already written stay as ordinary tasks.
  project_planner: true
  # RANKING, PART A (2026-11-22, Mike; goal_task_network_plan § 16). Any open task nobody judged
  # (no `stakes`) is judged by the task_judge agent off this tick — vital or missable, and a
  # priority, against the user's goals, mission and values, by what missing it would cost. Until
  # judged a task is back-burner. Off: unjudged tasks stay back-burner, and no model is called.
  task_judge: true
  # RANKING, PART B, PHASE 1 (2026-11-23; archive/plans/ranking_values_plan_2026-11-23.md, values
  # in config/modules/ranking.yaml). `cost_record`: every open task gets a cost record — what a
  # delay would cost, who bears it, how it grows — written by task_judge (one pass on the day it
  # ships, ~$0.04 for one user, under the caps below) and correctable in chat. It never writes
  # `stakes`, so it changes no ranking by itself. Off: nothing is recorded and the fields leave
  # the schemas.
  cost_record: true
  # `ranking_v2`: rank the day by the regret of delay (§ 10 R3, R9). OFF in phase 1 — each build
  # computes the v2 order beside Part A's and writes it to the plan's trace only (shadow); compare
  # with scripts/ranking_report.py --compare. On only after Mike's three-morning comparison (v2
  # preferred on ≥ 2 of 3, no real obligation below the cut). Off restores Part A exactly.
  ranking_v2: false
  # RANKING, PART B, PHASE 2 (2026-11-23; same plan, §§ 4.5, 4.10, 11 rows 10–13, 11b). Each acts
  # only with `ranking_v2` also on — it needs v2's cost of delay — and is otherwise SHADOW: every
  # build writes what it would have done to the plan's trace and ranking_state.json's `trace`
  # (read with scripts/ranking_report.py --protected / --behind). Flip each after its own
  # three-day walkthrough; off restores phase 1's behaviour exactly.
  # `protected_v2`: a task enters family time, rest or exercise only when its cost of delay
  # exceeds the intrusion cost (ranking.yaml `protected`), and never silently — the user is asked,
  # with a recommendation, and answers in chat (answer_ask). Unanswered, the window stays
  # protected. Off: Part A's rule — an essential task with no other room takes it, and says why.
  protected_v2: false
  # `behind_v2`: when the user is behind (≥ 3 overdue, or the top task skipped 2 of the last 3
  # days) the day leads with 1–2 quick wins; a slipping task is raised at most twice without new
  # information, then waits for the weekly list; at most 3 such prompts a day (ranking.yaml
  # `behind`, `raise`). Off: Part A's slipped-task asks, once a day, every day (Mike's M3).
  behind_v2: false
  # RANKING, PART B, PHASE 3 (2026-11-23; same plan, §§ 4.11–4.13, 11 row 15, 11c).
  # `back_burner`: trivia nobody has mentioned for 21 days is parked (closed as moot, row kept,
  # revived by a fresh mention), after one mention in the weekly conversation the week before.
  # OFF = the dry run: each day the pass writes what it would park to the trace
  # (scripts/ranking_report.py --back-burner) and closes nothing, notices nothing.
  back_burner: false
  # With `back_burner` on: true = the weekly conversation carries the notices and the guarded
  # lines, but still nothing is parked; false = parking is live. Flip after the dry-run review.
  back_burner_dry_run: true
  # `weekly_priorities`: the weekly review also looks back — what Metatron moved, a clash held,
  # what is slipping or about to be parked, one keep-in-touch or upkeep clock, the regret question,
  # one check on how things feel — from material code assembles; and a user with no weekly review
  # is offered one, once, at a day and time they pick. Off: the weekly review is the week ahead only.
  # ON at the phase 3 deploy (Mike, 2026-11-23) — its live check is two weekly reviews.
  weekly_priorities: true
  # `ranking_signals`: the daily tick appends what the ledger shows to ranking_signals.jsonl
  # (completion, momentum, missed obligations, intrusions, questions asked, overrides) and
  # record_signal keeps what the user says (regret, how things feel, overload, nagging,
  # satisfaction). Recording only — nothing a user sees. Off: nothing is written.
  # ON at the phase 3 deploy (Mike, 2026-11-23), so the first monthly review has a month to read.
  ranking_signals: true
  # GOAL–TASK NETWORK PHASE 3, PART A (2026-11-24; goal_task_network_plan § 17). All three OFF;
  # each off restores phase 2 exactly. Tuning in `goal_network:` below.
  # `rolling_wave`: a large (L) goal the Goals Interviewer has talked through in full (Mike,
  # 2026-11-24: "2 questions isn't nearly enough for an L goal") is planned one milestone at a
  # time — the next milestone as small steps, later ones as rough outlines kept on the plan
  # record, never on the task list — and the next is broken into steps when the last step of the
  # current one closes, on the same queue and daily cap. Off: plan_project refuses an L goal.
  rolling_wave: false
  # `projected_finish`: each planned goal's likely finish is worked out daily from what is left
  # and the pace the user actually keeps; when it passes the goal's date, or slips by more than
  # the margin below, it is said once as Important with the new date and one fix. Code only.
  projected_finish: false
  # `revet`: a goal whose steps keep slipping (trigger 1), or a large goal at 2 weeks, 6 weeks,
  # then each quarter (trigger 2), is asked about once — in the weekly look back (Mike,
  # 2026-11-24), at most one goal a week — as a question, never a verdict. Detection is code.
  # The asking and the answer are kept in ranking_signals.jsonl for the monthly review.
  revet: false
  # GOAL–TASK NETWORK PHASE 3, PART B (2026-11-24; plan § 18). Both OFF; each off restores part A.
  # `goal_talk`: a large goal gets a talk-through with the Goals Interviewer, and the talk is the
  # first task of its project (Mike). Synth offers it once; a yes starts it there and then — the
  # user's messages go to the Interviewer about that one goal until it is settled or they stop.
  # It starts from what Metatron already knows of the goal (a playbook), else one guarded lookup
  # of what it realistically takes; code does the arithmetic. Its verdict is the only path to the
  # full pass that `rolling_wave` plans from. Off: no talk task, no talk, part A unchanged.
  goal_talk: true
  # `satisfaction_gap`: how much the user looked forward to something against how it turned out,
  # per class (a purchase, an outing, …) — heard in passing, asked rarely and only where it is
  # targeted, kept in ranking_signals.jsonl; the gap is told to Synth (and Finance, for
  # purchases) as evidence, and to the user now and then as a question, good or bad. Off: nothing
  # is recorded, asked or said.
  satisfaction_gap: false

# Goal–task network phase 3, part A — one home for its tuning (plan § 17). Here, not a new file,
# because the project planner's limits already live in `limits:` below and the loader re-reads
# this file on change.
goal_network:
  # An L goal with no date of its own is planned no further out than this. Heuristic.
  l_horizon_days: 365
  # At most this many milestones in one L plan (the next, broken into steps, plus outlines).
  max_milestones: 8
  # The time a week a planned goal is assumed to get when the user gave none. Replaced by the
  # pace actually kept (estimated minutes of done steps per week) once `pace_min_steps` steps of
  # that plan are done — "durations correct from actuals" (§ 4.5). Heuristic.
  default_weekly_minutes: 150
  pace_min_steps: 2
  # The finish is said again only when it slips later than the last date said by more than this
  # (days), by size. Crossing the goal's own date is always said, once. Heuristic.
  finish_margin_days: {M: 3, L: 14}
  revet:
    # Trigger 1: a goal's steps slipped, were skipped or got "not yet" on at least
    # `noncompliance_days` distinct days within `window_days`. 4 in 7 is the worked example
    # (plan § 4.2): repotting the basement plants proposed on at least four mornings 11-12 →
    # 11-18, not done. After it fires it is quiet until answered, or `rearm_days` pass.
    window_days: 7
    noncompliance_days: 4
    rearm_days: 28
    # Trigger 2: days after the goal was vetted, then every `every_days` (plan § 4.2: "about 2
    # weeks, 6 weeks, then each quarter"). L only — an M goal has one end date, and projected
    # finish watches it. Obligations never get trigger 2: nobody chooses whether to file taxes.
    checkpoints_days: {L: [14, 42]}
    every_days: {L: 91}
    # At most this many goals asked about a week, and a question unsaid after this many weekly
    # reviews is let go.
    per_week: 1
    max_shows: 3
  # Part B (plan § 18). The talk-through task: its length (minutes), how long it has (days), and
  # how long a quiet talk stays open before the next message goes back to the usual conversation
  # (hours). Heuristic.
  talk:
    task_minutes: 30
    due_days: 14
    idle_hours: 6
    # The verdict that takes an L goal on (and lets rolling wave plan it) needs this many of the
    # user's own messages in the talk first — a real talk, not an opening line (Fable S2).
    min_user_turns: 4
  # Anticipated vs experienced (plan § 18, Mike: "holistic, and targeted"). Heard in passing costs
  # nothing; ASKING costs attention, so: at most `asks_per_week` questions a week, both kinds
  # together; "how was it?" asked `after_days` after (a purchase `after_days_purchase`); a class's
  # gap is evidence once it has `evidence_pairs` pairs and is told to the user, as a question,
  # once it has `lesson_pairs` with a consistent gap of at least `lesson_gap` points — at most
  # once every `lesson_every_days` days in all. Classes are targeted (asked about) when a current
  # goal's title carries one of their words, or when their pairs already show a gap. Heuristic.
  satisfaction:
    asks_per_week: 1
    # An invitation to ask, shown on the user's own turn, is stamped by day; after this many days
    # in a week no more are shown, whether or not one was asked or answered (Fable S8).
    invite_days: 2
    after_days: 1
    after_days_purchase: 3
    evidence_pairs: 3
    lesson_pairs: 4
    lesson_gap: 1.0
    lesson_every_days: 30
    targets:
      purchase: [spend, spending, budget, money, saving, savings, debt, shopping]
      activity: [exercise, swim, gym, strength, run, running, fitness, yoga, walk, sport]
      social: [friends, social, friendship, community]
      outing: [outings, concert, theatre, evenings]
      trip: [travel, trip, holiday]
      commitment: [volunteer, commitment, commitments]

replaces_jobs: [companion_checkin]

# Review finding #5 (§ 10 R10): a nudge due shortly before a CONVERSATIONAL fixed session is
# carried into it and said there under DUE NOW. Every fixed job run by the coordinator counts
# (mike's VM also has a child's school-run key, which a name list missed); the Sunday analysis jobs say
# nothing to the user and do not. Names listed here are added to that rule — for a conversational
# job run by another agent. Empty by default.
shield_jobs: []

# Score weights (plan § 5.2). Baseline is the explicit priority, else the linked goal.
score:
  priority: {high: 30, normal: 20, low: 10}
  goal: {essential: 30, linked: 20, none: 15}
  vital: {overdue: 40, due_today: 30, due_tomorrow: 15, in_lead: 5}
  missable: {due_today: 10, lapsed: 0}
  habit: {planned_day: 10, at_risk: 15, daily: 10}
  interval_due: 15
  medication: 50
  # A deadline climbs from the start of its window toward its due-day weight over at most this
  # many days, instead of jumping only on the last two (§ 16). 0 turns the climb off.
  ramp_days: 14
  # A score move at least this large between builds is a change in what matters — a reshuffle.
  reshuffle_delta: 10

limits:
  # Model reshuffles at least this many minutes apart unless forced, and at most this many a day.
  reshuffle_gap_minutes: 15
  reshuffles_per_day: 12
  # Google Routes is billed per request and no spend meter sees it (plan § 12).
  travel_lookups_per_day: 60
  travel_assumed_minutes: 30
  # The calendar snapshot is refreshed in the background once older than this.
  snapshot_max_age_minutes: 10
  # The one synchronous fetch — after Metatron wrote the calendar this turn — gives up after this.
  calendar_fetch_timeout_seconds: 3
  # Blocks starting this soon keep their slot unless their fixed anchor moved.
  frozen_minutes: 20
  # A task with no recorded length is placed at this, flagged "length unknown".
  default_task_minutes: 30
  # The Synthesizer is told the user has free time only when the gap before the next fixed
  # thing is at least this long (synth_now_next_plan_2026-10-30.md § 8 F5).
  free_min_minutes: 45
  # At most this many "Important" candidates reach the Synthesizer per day (§ 8 F2).
  important_max: 2
  # A reshuffle worker that has not returned in this long is superseded.
  reshuffle_stale_seconds: 180
  # The reply path waits at most this long for the plan lock, then renders without writing.
  reply_lock_ms: 200
  # Tasks with no length on file the Synthesizer is asked to ask about, at most, a day — each one
  # once, ever (code-raised: the instruction alone never fired, 10-24 to 10-26).
  length_asks_per_day: 2
  log_retention_days: 90
  plan_retention_days: 3
  # The project planner (goal–task network plan § 10 R8). One reasoning-tier call per planned
  # item (+ at most one retry): ~$0.02 each at today's price, ~$0.04 after the introductory price
  # ends — so 6 a day caps a persona at ~$0.12/day (~$0.24 after). Typical use is a few a week.
  project_plans_per_day: 6
  project_plan_gap_minutes: 10
  # Two reasoning calls (one retry) fit well inside this; a worker past it is presumed dead.
  project_plan_stale_seconds: 600
  # No step longer than this — a longer one is split (§ 4.3).
  project_step_max_minutes: 90
  # The task judge (§ 16): one reasoning-tier call judges up to `task_judge_batch` unjudged tasks
  # — ~$0.01 a call at today's price (~$0.02 after the introductory price ends) — so 6 a day caps
  # a persona at ~$0.06/day (~$0.12 after). Typical use: one call on the day it ships (the
  # backlog), then one now and then, when an agent opens a task unjudged. A failed call gives its
  # place back; a verdict that moves a score 10+ can cost one reshuffle (under reshuffles_per_day).
  task_judge_calls_per_day: 6
  task_judge_gap_minutes: 10
  task_judge_batch: 25
  task_judge_stale_seconds: 300
