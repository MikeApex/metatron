# Cloud routing configuration — used when DEPLOYMENT_MODE=cloud (VM deployment).
#
# All agents route to Vertex AI Gemini 3.1 Pro via the google-genai SDK.
# No Ollama references — the VM does no local inference.
# Privacy basis: Vertex AI ZDR (contractual sequestration, no training on data).
# This file is a temporary path; north star is private hardware (local/A100/H100).
#
# To activate: set DEPLOYMENT_MODE=cloud in the VM's .env file.
# Local dev: omit DEPLOYMENT_MODE or set DEPLOYMENT_MODE=local — routing.yaml loads instead.
#
# allowed_tools: per-agent schema whitelist. Only these tool schemas are sent to the LLM.
# All Python functions remain registered in register_tools(); schemas for unlisted tools
# are simply not advertised. Omit the field to pass all schemas (default / bare agents).

local_enabled: false

# Flash override for complexity="quick" calls (non-sensitive agents only).
quick_override:
  provider: gemini
  model: "models/gemini-3.1-flash-lite"

# Agent model assignments — all on Vertex Gemini 3.1 Pro.
agents:

  # ── Head layer ───────────────────────────────────────────────────────────────

  coordinator:
    provider: gemini
    model: "models/gemini-3.1-flash-lite"   # single-pass routing directive, no tools — Flash-Lite is sufficient
    allowed_tools: []

  synthesizer:
    provider: gemini
    model: "models/gemini-3.1-pro-preview"  # user-facing voice; safety flag integration; keep on Pro
    allowed_tools: [run_subagent, run_model_conference, write_persona, write_profile, read_profile, write_config, write_wishes, read_wishes, generate_emergency_card, write_quality_event, write_schedule, list_schedules, delete_schedule, update_goal]

  # ── Data and analysis ────────────────────────────────────────────────────────

  diarist:
    provider: gemini
    model: "models/gemini-3.1-flash-lite"   # write-only; fire-and-forget target
    allowed_tools: [write_journal, write_archive, write_log, write_wisdom]

  pattern_miner:
    provider: gemini
    model: "models/gemini-3.1-pro-preview"  # analytical depth; scheduler task, not on real-time path
    allowed_tools: [get_log_window, write_insight_report, read_recent_insights, write_baseline_period, read_baseline_periods, write_retrospective, get_baseline_context, create_semantic_anchor, shuffled_null_score, score_against_anchors]

  goals_interviewer:
    provider: gemini
    model: "models/gemini-3.1-pro-preview"  # interview quality matters; runs infrequently
    allowed_tools: [read_goals, write_goals, write_config, write_retrospective, create_semantic_anchor, write_aspirational_baseline, update_goal]

  # ── Personal specialists ─────────────────────────────────────────────────────

  mental_wellbeing:
    provider: gemini
    model: "models/gemini-3.1-pro-preview"  # clinical flags (MUST_SURFACE, CLINICAL_CONCERN); never downgrade
    allowed_tools: [read_log, write_log, write_journal, search_memory, read_agent_config, write_agent_config, read_wisdom, write_wisdom]

  physical_health:
    provider: gemini
    model: "models/gemini-3.1-pro-preview"  # medication / symptom class; same safety rationale as MW
    # read_agent_config granted 2026-08-04: MEDICATION_MISSED_CRITICAL classification must come
    # from the stored medication_profile and never from inference (physical_health.md:106,123).
    # Without the read grant the flag is structurally unfireable — the agent is required to
    # consult a profile it has no tool to reach. Two warn-mode entries on 2026-08-03 recorded it
    # attempting exactly this. write_agent_config deliberately NOT granted: writing a medication
    # profile is a larger privilege and a separate decision (DEV_BACKLOG Inbox).
    allowed_tools: [read_log, write_log, search_memory, read_wisdom, write_wisdom, read_profile, write_profile, read_agent_config]

  work_vocation:
    provider: gemini
    model: "models/gemini-3.1-flash-lite"   # no clinical stakes
    allowed_tools: [read_log, write_log, read_agent_config, write_agent_config, read_profile, write_profile]

  relationships:
    provider: gemini
    model: "models/gemini-3.1-flash-lite"   # no clinical stakes
    allowed_tools: [read_log, write_log, write_journal, write_contact, read_contact, list_contacts, log_interaction, search_contacts, read_profile, write_profile]

  finance:
    provider: gemini
    model: "models/gemini-3.1-flash-lite"   # arithmetic tracking; upgrade to Pro if hard-fail results were marginal
    allowed_tools: [read_log, write_log, read_agent_config, write_agent_config, read_profile, write_profile]

  learning_growth:
    provider: gemini
    model: "models/gemini-3.1-flash-lite"
    allowed_tools: [read_log, write_log, search_memory, read_agent_config, write_agent_config]

  recreation_hobbies:
    provider: gemini
    model: "models/gemini-3.1-flash-lite"
    allowed_tools: [read_log, write_log]

  logistics:
    provider: gemini
    model: "models/gemini-3.1-flash-lite"
    allowed_tools: [read_log, write_log, read_calendar, write_calendar_event, get_weather, read_profile, write_profile, write_schedule, list_schedules, delete_schedule, fetch_url, read_email, send_email]
    # fetch_url + read_email added 2026-08-04. Granted here and not more widely:
    # both return content written by strangers, so the blast radius of an injected
    # instruction is the holder's toolset. Logistics is the agent that actually needs
    # them (bookings, confirmations, invitations). research_agent already reaches them
    # because it omits allowed_tools entirely, which means all tools — see the note in
    # DEV_BACKLOG.md. Widen only on a logged denial, per standing practice.

  # ── Cloud-only (decontextualized) ────────────────────────────────────────────

  research_agent:
    provider: gemini
    model: "models/gemini-3.1-pro-preview"  # grounded search; decontextualized only
    allowed_tools: [fetch_url]
    # Explicit list as of 2026-08-04, and the wording it replaced was misleading:
    # "no allowed_tools — bare mode (no personal tools)" conflated two different
    # things. Bare mode (orchestrator `_run_single_agent`) withholds personal
    # *context*; omitting allowed_tools grants *all* tools (`None` = allow all in
    # core/router.py). It read as the most restrictive setting and was the least.
    # Harmless while the grounded path passed no tools at all — but that changed
    # the same day, so the list is now real. fetch_url only: Research reads pages,
    # it writes nothing.
