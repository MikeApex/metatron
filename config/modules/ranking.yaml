# config/modules/ranking.yaml — ranking Part B: rank by the regret of delay.
#
# Plan: archive/plans/ranking_values_plan_2026-11-23.md (§ 11 governs the values, § 10 the design).
# Research: archive/plans/ranking_research_2026-11-23_claude-chat.md — "research § n" below is its
# section. A value the report marks heuristic is labelled heuristic here; a value nothing in the
# report supports is labelled placeholder. Every value is a starting point, refined by each user's
# evidence and, where a user differs, by config/personas/{p}/ranking.yaml (merged over this file;
# none is written by code).
#
# Read by tools/ranking.py, re-read when this file (or the persona's) changes on disk. The
# switches live in day_plan.yaml: `cost_record` (the judge records costs) and `ranking_v2` (the
# day is ranked by this file). With `ranking_v2` off, this file changes nothing a user sees —
# the v2 order is computed beside v1 and written to the plan's trace only (phase 1, shadow).

# --- importance: what missing it would cost -----------------------------------------------------

# The grade ladder, geometric so the worst cost dominates (research § 10: ratio 3 kept).
grades: {minor: 10, major: 30, severe: 90}

# Several costs combine as shares of the maximum: G = 100 × [1 − ∏(1 − sᵢ)] (research § 10, the
# multiplicative comorbidity rule, Flanagan 2006). Worst sets the floor; each further cost adds
# less; the total is bounded. Two majors = 51; severe + major = 93.
shares: {minor: 0.1, major: 0.3, severe: 0.9}
# A weighted share never reaches 1 (a social severe × 1.5 would be 1.35): capped here, so the bound
# holds. Social still outranks financial at every grade; at severe the gap narrows (99 vs 90).
share_cap: 0.99

# Dimension weight at an equal grade (research § 3a, heuristic: relationship harm ≥ financial,
# 1.5 : 1; others 1.0).
dimension_weight: {financial: 1.0, legal: 1.0, health: 1.0, social: 1.5, psychological: 1.0}

# Who mainly bears it (B3; research § 10). Applied in the cost of delay only — never to whether a
# task is vital (§ 10 R1). `own_org`: an organisation the user owns or runs, whose harm is largely
# theirs (research § 10, "close to 1.0 where the person owns the organisation"). Harms that rebound
# on the user (job, reputation, legal) are recorded as the user's own costs, not folded in here.
bearer_weight: {self: 1.0, close: 1.0, own_org: 1.0, others: 0.7, org: 0.5}

# A task with stakes but no cost record yet (all of Part A's; § 4.1's fallback, read only while
# a task awaits the judge's recording pass).
fallback: {vital: major, missable: minor, unjudged: minor}

# --- cost of delay: the four shapes ----------------------------------------------------------------

shapes:
  # step, after its date: the cost already landed; one more day costs this share of G (plan § 4.3,
  # placeholder).
  step_residual: 0.2
  # accruing, after its date: G × (1 + rate × days late) (placeholder — interest, a backlog).
  accrual_rate: 0.1
  # cliff, before its date: × this; after its date the task is moot (plan § 4.3, placeholder:
  # reversibility "a strong vector", B1).
  reversibility_weight: 2.0
  # neglect: G × min(cap, (r − 1)^k), r = days since last done ÷ the wished cadence, zero until the
  # cadence has passed (research § 3b). k = 1.5 for kin and friends alike — Mike, 2026-11-23: keep
  # it convex (the report's kin 1.0 is a guess it says no study fits). cap = M (plan § 10 R4).
  neglect_k: 1.5
  neglect_cap: 3

# --- slack: can it still be done in time? ----------------------------------------------------------

# Start-late buffer, tiered by the task's length (research § 2, medium confidence):
# < 15 min 0% (short tasks are OVER-estimated), 15 min – 4 h 35% (effort overrun), longer —
# a multi-day completion — 65% (Buehler 1994). No length on file: the fallback.
buffer:
  tiers:
    - {under_minutes: 15, buffer: 0.0}
    - {under_minutes: 240, buffer: 0.35}
    - {under_minutes: null, buffer: 0.65}
  fallback: 0.40
  # An aversive one-off (research § 2: +100%). Not read in phase 1 — nothing yet marks a task as
  # aversive; phase 2's "behind" work is where that signal arrives.
  aversive: 1.0
  # Learning the user's own bias (research § 2, heuristic statistics): pooled across task classes,
  # shrunk toward the tier defaults with weight n/σ² ÷ (n/σ² + 1/τ²) on the log actual/predicted
  # ratio — 0.43 at 3 observations, 0.71 at 10, 0.83 at 20.
  # Phase 1 kept this off (Fable diff review #7): in shadow the user is never shown an early
  # start, so every long task trained "starts late", and the first measure (calendar days from the
  # must-start day) read +0.2–0.4 even for a task done on its date. Phase 2's observation holds
  # under v2 (plan § 11b): it learns only while `ranking_v2` is on — a start the user was shown —
  # from the first day the task was placed, in whole days against whole days allotted. So ON here
  # is inert until the flip.
  learn: {enabled: true, sigma: 0.5, tau: 0.25, keep: 50}

# How many minutes of a day are free for tasks, to turn a length into days (heuristic, phase 1 —
# the shadow measures it; reading the real day shape is a later refinement). It is what makes a
# four-hour task due Tuesday a must on Sunday while a ten-minute Monday task is not.
free_minutes_per_day: 120

# The climb: a step's cost of delay rises from 0 to G as its slack falls from this many days to 0
# (Part A's 14-day climb). A must — slack ≤ 0 — costs its whole weight whatever this is, so it
# orders advance work only; a task needing longer than this climbs over its own need instead.
climb_max_days: 14

# --- attention: the base cost of any task ----------------------------------------------------------

# Every task costs at least one attention block (B7; research § 1, low confidence): 5 min when
# slotted between tasks; 15 when it breaks into a focus block (read at placement — phase 2).
# Similar small tasks of one kind share one block (Ibanez 2018).
attention_block: {between: 5, focus: 15, batch_max_minutes: 15}

# --- what goes into the day (§ 10 R3, R9) ----------------------------------------------------------

# Advance work — upcoming tasks and current goal steps, offered when the musts leave room — is
# suggested only above this cost of delay; below it the time is the user's own, on purpose
# (heuristic, measured in the shadow). 10 = a minor cost's whole weight: a minor task is never
# pulled forward, it waits for its own day; a major one is suggested within ~9 days of its date.
advance_floor: 10
# The current undated step of an active goal (plan § 11a, owed 2) has no date to climb toward:
# it is offered as advance work at this share of its weight, the floor still applying — so a
# major step (30 × 0.5 = 15) is offered and a minor one (5) waits for the user (placeholder).
undated_step_factor: 0.5

# Medication keeps a fixed lift, as in Part A, in grade units (placeholder: a severe's worth).
medication_lift: 90

# The v2 cost of delay is written to a candidate's integer `score` × this, so the Important line
# and the build's comparisons keep working.
score_scale: 1.0
# A move this large between builds is a change in what matters — a reshuffle (§ 10 R4: its own
# value, measured in the shadow; placeholder).
reshuffle_delta: 15

# --- promises and people -----------------------------------------------------------------------

# A promise to someone with no date gets one (B25; research § 9, low confidence): 3 days for a
# quick digital favour (photos, a link, an intro), 7 for an effortful or physical one. A task is
# "quick" when it takes at most `quick_max_minutes`, or has no length and is admin.
implied_promise_days: {quick: 3, effortful: 7, quick_max_minutes: 15}

# Suggested cadences when the user leaves it to Metatron (research § 3c, Dunbar layers, medium-low;
# descriptive, not normative — the user's answer sets the clock, B9).
cadence_defaults: {intimate: 7, close_friend: 30, wider: 120, network: 365}

# --- protected time (plan § 4.5 as amended by R6; § 11 rows 10–11) — PHASE 2, flag protected_v2 ---

# A task may enter a protected window only when its cost of delay exceeds the intrusion cost, and
# never silently: it becomes a question to the user, with a recommendation (B12, B29). Only a
# must may ask; advance work never enters. Sleep and meals are outside this grid (R6): neither is
# a protected window, and nothing is placed in either.
protected:
  # The FIRST intrusion into a class of window, in grade units (research § 4: family 2.5 : rest
  # 1.5 : exercise 1.0 — Bennett 2018, Wendsche 2017 — scaled so a family evening ≈ a major cost,
  # § 10 R4). A window's class is its first activity; time held for an unanswered family event,
  # and a childcare duty, are family. `own` — time the user keeps with no label — is rest.
  # Mike, 2026-11-23: a severe task due today (cost 90) is therefore asked about family time
  # twice in a week (30, then ≈ 85) and kept out the third time — ruled; every intrusion is a
  # question anyway.
  bases: {family: 30, rest: 18, own: 18, exercise: 12}
  # Any other protected activity (social, creative …): placeholder — nothing in the research
  # prices it; rest's value until the shadow says otherwise.
  default_base: 18
  # The k-th intrusion into a class costs base × k^exponent (research § 4: recovery debt is
  # convex, Van Dongen 2003); k counts recent intrusions, each fading on this half-life — 25%
  # left after a week (research § 4, de Bloom 2009).
  exponent: 1.5
  half_life_days: 3.5
  # Intrusions older than this are forgotten (0.5^6 ≈ 1.6%: nothing left to count).
  keep_days: 21

# --- behind (plan § 4.10; § 11 rows 12–13) — PHASE 2, flag behind_v2 -------------------------------

behind:
  # Behind: at least this many items overdue (research § 6, KC et al. 2020; heuristic) …
  overdue_min: 3
  # … or the day's top-ranked task skipped on this many of the last `skip_window` days.
  top_skipped_min: 2
  skip_window: 3
  # While behind, the day leads with quick wins — at most this many, this many minutes in all
  # (research § 6: 1–2, never more than 3, ≤ 20 min; Amabile & Kramer 2011, Ibanez 2018) — the
  # first ideally a step of the hard task no longer than `first_step_minutes` (Gal & McShane 2012).
  quick_wins_max: 2
  quick_wins_minutes: 20
  first_step_minutes: 10

# Raising a slipping task (research § 7: each repeat of the same prompt is heeded ~30% less,
# Ancker 2017; Klasnja 2019, Fitz 2019).
raise:
  # A placed task is raised when skipped this many days, or once its slack goes below 0 …
  skipped_days: 2
  # … at most once a day, and at most this many times without new information; then it waits for
  # the weekly conversation — "keep, reschedule or drop?" (phase 3).
  max_without_news: 2
  # At most this many prompts a day that the system itself starts from these paths — raises and
  # protected-time questions together (research § 7: ≤ 3 a day). Past it a question waits, and
  # its window stays protected.
  prompts_per_day: 3

# --- something the user enjoys (plan § 4.9; § 11 row 14) ------------------------------------------

# An item marked `enjoyed` with no time of its own is placed within this many minutes after an
# effortful one — heavy concentration or exercise (research § 5: a gap ≤ 15 min; Premack, Kirgios
# 2020). Nothing names it a reward (research § 5: works unframed; Deci 1999 on framing).
enjoyed_gap_minutes: 15

# --- looking up a public fact before asking (plan § 4.7, B22; § 10 R7) — PHASE 2 ------------------

# lookup_public_fact asks the Research Agent, through the code guard in tools/lookup_guard.py.
# The Research Agent answers from Google Search grounding, which is BILLED PER SEARCH AND SEEN BY
# NO SPEND METER (plan § 8, Unseen 1) — this cap is the only bound. Price, checked by Mike
# 2026-11-23 (a pasted summary of the Vertex AI pricing page, not the page itself): Gemini
# 3-series grounding (research_agent is models/gemini-3.8-flash) = $14 per 1,000 search QUERIES,
# and one lookup may run a few; first 5,000 queries a month per account free. (2-series would be
# $35 per 1,000 grounded REQUESTS — not our row.) At 5 a day × ~3 queries, the worst case is
# $0.21 a day per user (~$6/month) before the free allowance; typical use is a few a week.
# Gemini 2027-01-01 pricing change: re-check this figure then.
lookups:
  # Was OFF at deploy (Fable diff review #1) until Mike checked the price above and ruled on
  # figures. Both done 2026-11-23: price $14/1,000 queries confirmed, figures refused.
  # Revert is this one line: enabled: false (the tool then answers "not available yet").
  enabled: true
  per_day: 5
  # Refuse any money amount or health reading in a question (plan § 4.7: "a health/financial
  # figure from the user's records" — the guard cannot tell theirs from a public one).
  refuse_figures: true

# --- the back burner (plan § 4.11, B26–B27; § 11 row 15) — PHASE 3, flag back_burner ---------------

# A one-off task that is trivia (worst grade minor, not vital by Part A), whose cost of delay has
# stayed below `cod` and that nobody has mentioned for `days`, is parked: closed as moot with reason
# back_burner, its row and history kept, revived by open_task on a fresh mention. Off (the shipped
# state) is the DRY RUN: the daily pass writes what it would park to the trace
# (scripts/ranking_report.py --back-burner) and closes nothing.
back_burner:
  # Mike, 2026-11-23 (§ 11 row 15): 21 days — research § 8 (Halder et al. 2026: abandonment flat
  # after day 10; auto-archive at 21, range 14–30).
  days: 21
  # From this many silent days the task is put in the weekly conversation once, the week before it
  # is parked (research § 8: "offer the task in the weekly review at ~14 days"). A task that names
  # a person, an obligation, health, a goal or more than trivia is put there instead of ever
  # being parked (B27).
  notice_days: 14
  # The notice is said at least this many days before the task is parked — Mike's "mentioned once
  # in the weekly conversation the week before" (§ 11 row 15), so "next week" is literally true.
  notice_lead_days: 7
  # Heuristic placeholder: below half a minor's whole weight (grades.minor 10). An undated minor
  # task costs 0; a minor one inside a week of its date costs ~5 and more.
  cod: 5

# --- the weekly priorities conversation (plan § 4.12, B28–B29) — PHASE 3, flag weekly_priorities ---

weekly:
  # "What Metatron moved and why, at most three lines" (§ 4.12 item 1), over the last 7 days.
  moved_max: 3
  moved_days: 7
  # What is slipping or about to be parked, guarded items first (§ 4.12 item 3). Past this many
  # the block gives a count — the conversation never reads out a list (B31).
  slipping_max: 5
  # Of those, at most this many QUESTIONS a week (keep, date or drop?) — the rest wait for another
  # week (Fable diff review #7: a first look-back of five questions is the "managed" failure;
  # research § 7: repeats and load are where acceptance collapses). Heuristic. Raised 2 → 5 by
  # Mike, 2026-11-24, when goal re-vet questions joined this queue (goal network plan § 17).
  questions_max: 5
  # A keep-in-touch or upkeep clock is offered when it is this far through its wished cadence
  # (1.0 = due today). Heuristic.
  clock_min_ratio: 0.8
  # How many times the one-off offer of a weekly conversation may be shown without being said
  # before it stops being shown (heuristic; § 4.12 "offered once").
  offer_max_shows: 3
