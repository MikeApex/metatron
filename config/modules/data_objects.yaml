# The user's logs and lists — limits (archive/plans/custom_logs_and_places_plan_2026-11-21.md
# § 3.1). Read by tools/data_objects.py `limits()`; a key missing here takes the code default.
#
# START HIGH (R29): the generic set is being learned from real use. Tightening any of these is a
# config edit, and nothing is deleted when it tightens — the objects past a cap drop out of the
# lists and stay readable by name.

# Objects named to one agent per turn. ~20 input tokens each; at 20 objects on the Synthesizer's
# tier ≈ $0.0003 a turn (plan § 7). The cap bounds the worst case at ~1,200 tokens a turn.
manifest_max_objects: 60

# The stores that already have their own tools (contacts, tasks, the calendar …) are registered
# but not listed: every agent that can read one already holds its tool and knows it exists, so
# listing them would cost every turn and tell nobody anything. Daily-log objects (sleep,
# exercise) ARE listed — they are the user's logs, kept in the daily log.
manifest_includes_native_stores: false

# Entries returned by one read; the newest are kept.
read_max_entries: 200

# A pending write ("adding that to your heart log") older than this, still unverified, is
# reported as not saved — a push and a note on the next reply. Never silence. The Diarist lands
# in seconds; two minutes is the restart/crash backstop, not the normal path.
pending_expiry_seconds: 120

# How long a read waits for a write still on its way to the same log ("read it back" said
# straight after an entry). Only paid when a marker is actually pending.
pending_wait_seconds: 8

# How alike a new log's name must be to an existing one to be refused as a duplicate (R18).
close_match_ratio: 0.85

# Daily-log objects: days read when none are given, and the most a read may ask for.
log_read_default_days: 14
log_read_max_days: 92

# Lists whose new entries also reach the development backlog (DEV_BACKLOG.md Inbox) as a feature
# request (Mike, 2026-11-23). A list's id, as the registry holds it.
dev_backlog_logs: [app_development_backlog]

# --- Places (phase 3 — archive/plans/data_objects_phase3_build_plan_2026-11-25.md) -----------
# Read by tools/saved_places.py `_limits()`. All code; no model call depends on any of these.
places:
  # A saved place's circle. A venue, not a neighbourhood — a zone's 150 m would swallow the shop
  # next door; GPS inside a building drifts ~30–50 m.
  default_radius_m: 75
  # Lookup results this far apart are different places with one name (a chain) — ambiguous,
  # saved unconfirmed until a visit or the user's yes (Mike, choice 1).
  ambiguity_m: 300
  # How far a saved place may be from where the user is (or will be) to be mentioned.
  near_max_m: 1500
  # An errand is raised when its task's place is this close.
  errand_near_m: 1000
  # The last reported position counts as "where" for this long; older, it says nothing.
  last_position_fresh_hours: 3
  # A raise the user neither took up nor declined is not repeated for the same kind of
  # occasion within this window. Memory, not a cap (R11): a decline waits for a verdict or
  # occasion change instead.
  raise_cooldown_hours: 12
  # The lookup's share of the reply path: started when the Coordinator names a place, joined
  # before the Synthesizer for at most this long. A late one still lands.
  lookup_budget_seconds: 1.5
  # "Keeps coming up" (Mike, choice 3 — phase 2's shape): mentions of an unsaved name within
  # the window that raise the question; a declined name waits until its count doubles.
  mention_threshold: 3
  mention_window_days: 30
  # Opening hours fetched with a place's lookup (Mike, 2026-11-26). true/false only — this is a
  # boolean read by code, never a bare `on`. Moves that one lookup to the Enterprise SKU.
  fetch_hours: true
