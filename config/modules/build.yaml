# config/modules/build.yaml — the two numbers Build reads from config.
#
# Plan: archive/plans/build_vertical_plan_2026-09-24.md sections 5, 8, 10.
#
# THIS FILE IS ON THE HARDCODED DENY LIST in core/build/gates.py, and
# scripts/check_build_registration.py asserts that the list still names it. That
# is the entire reason a cap here is a cap: Build cannot edit this path, so the
# only hand that raises one is Mike's.
#
# WHAT IS NO LONGER HERE, AND WHY IT WOULD BE WRONG TO PUT IT BACK.
#
#   `autonomy.ceiling` and `autonomy.may_create_agent_files` were the v3
#   overlay's permission dial: Build wrote generated agent files itself, at
#   runtime, on the VM, unattended — so a flag had to say how far it could go.
#   Under ruling 4 Build stops at a reviewed diff in a worktree and MIKE COMMITS.
#   His approval at [N9] and his commit at [N13] are the ceiling, and they are
#   not a setting. A flag that still said `may_create_agent_files: false` would
#   describe a permission system that no longer decides anything, which is worse
#   than no flag — somebody would eventually read it as the control.
#
#   `agent_construction.max_lines` and `required_sections` are now the hardcoded
#   floor in core/build/gates.py (220 lines; Role, Scope, Output format,
#   Confidentiality). gates.max_agent_lines() will still LOWER itself to a value
#   set here, never raise — so re-adding the block is possible and only ever
#   tightens. It is absent because nothing has needed it tighter.

# Filing caps, read by core/build/tickets.py. Both bound what the VM may
# ACCUMULATE, never what Mike may build — the bound on the Mac side is the
# session he is sitting in.
#
# max_proposed is the one that matters. A full inbox means gap detection is
# over-firing, and the fix is narrowing the trigger in coordinator.md, not
# raising this number. Raising it hides the signal the cap exists to give.
caps:
  max_proposed: 12
  max_jobs_per_day: 4

# Ruling 9. A PARAMETER WITH NO CONSUMER, recorded deliberately.
#
# Mike starts each build by hand for now. A future poller — one that runs
# Inquiry alone on the VM when a ticket arrives, without a person present —
# would be the first thing that needs a per-step spend allowance, and this is
# the figure it would read. Nothing reads it today.
#
# It is written down now rather than when that poller is built, because a
# spending limit decided at the moment you want to spend is not a limit. Under
# a dollar per step is Mike's number, set while nothing was asking for it.
api_allowance_usd_per_step: 1.00
