# Spend guard — daily runaway protection.
#
# This exists because GCP's own budget data lags by hours, so the $70 soft cap
# and $150 hard cap cannot react at runaway speed. A retry loop can burn a
# month's budget before a budget alert fires. This layer runs in-process and
# reacts in seconds.
#
# Two independent guards, because they fail differently:
#
#   1. Rate limit  — "more than N sessions an hour means something is looping".
#                    Needs no pricing data, so it still works if the rates below
#                    are stale or a new cost source appears. This is the robust one.
#   2. Spend limit — token counts x the rates below. Maps to actual money, so the
#                    thresholds mean something, but depends on the table staying
#                    roughly current.
#
# Accuracy note: these thresholds are for catching order-of-magnitude runaway,
# not for accounting. An estimate that is 2x wrong still catches a 100x loop.

enabled: true

# --- Spend thresholds (USD, per day, estimated from token counts) ---
# Warn, then refuse. The gap is deliberate: a warning that is also a hard stop
# gives no chance to intervene before the system goes silent.
#
# PER HOST. The VM and the Mac both bill the same Vertex project and each keeps
# its own counter — see the header note in core/spend_guard.py. Two hosts means
# the worst-case system ceiling is 2x the stop value below.
#
# Re-baselined 2026-08-08 against Cloud Monitoring rather than against the
# guard's own output, which was the whole problem: thinking tokens were excluded
# from every output count, so the old $5/$10 were denominated in a unit worth
# roughly a third of a real dollar on Pro traffic. Measured Aug 1-8: 20.88M input
# / 1.10M output actual, against 15.89M / 0.30M recorded across both hosts.
#
# The new values are runaway detectors, NOT a budget. Real days measured in that
# window ran ~$2-4/host routine and ~$5-6/host when the A4/B1 suites ran, so an
# alert at 6 stays quiet on a normal heavy day and a stop at 15 is unambiguously
# abnormal. Budget enforcement is the GCP soft/hard caps, which are a different
# mechanism with a different failure mode (see CLAUDE.md - Billing Protection).
alert_usd_per_day: 6.0
stop_usd_per_day: 15.0

# --- Uplift for traffic this guard cannot see (measured 2026-08-21) ---
# The guard counts one thing: pipeline turns, via trace.record_turn_tokens. Vertex
# meters more than that. On 08-21 Cloud Monitoring recorded 160 model invocations
# and 1,440,294 input tokens against the guard's 130 and 1,327,517 — a 23% gap in
# calls, reproduced the next day (32 vs 26, also 23%).
#
# Two known sources, neither reachable from the turn-recording path:
#   - Context-cache CREATION ingests the whole cached prompt as billed input with
#     no generate call attached. Confirmed by controlled probe 08-20: the Mac's
#     state file read calls=0, cache_grants=1 while Monitoring showed 1 invocation
#     and 12,001 input tokens.
#   - Retried and fallback calls. Vertex bills the attempt; the trace keeps only
#     the result, and carries no retry field to count them from.
#
# Metering creation exactly is easy; the residual is not attributable without the
# BigQuery billing export, which has been dark since 2026-08-12. So the whole gap
# is carried as one honest factor rather than half-fixed with an unmeasurable
# remainder. `usd` below stays the raw sum of what was actually observed; the
# uplifted figure is what the thresholds judge and what usd_billed_est reports.
#
# Round UP deliberately: this is a runaway detector, and reading high fails safe.
# Measured cost ratios were 1.16-1.24 and call ratios 1.23 on both days.
#
# RE-DERIVE, don't trust: compare a full day's data/diagnostics/spend_<date>.json
# against the Cloud Monitoring metric
# aiplatform.googleapis.com/publisher/online_serving/model_invocation_count.
# Set to 1.0 to disable. Retire this in favour of real attribution once the
# billing export is live again.
unmetered_uplift: 1.25

# --- Rate limit (pipeline sessions started, rolling 60 minutes) ---
# Normal load is ~7 scheduled sessions/day plus interactive use. These are set
# well above that so ordinary bursts do not trip them.
alert_sessions_per_hour: 20
stop_sessions_per_hour: 60

# --- Pricing, USD per 1M tokens ---
# Verified 2026-08-05 against cloud.google.com/vertex-ai/generative-ai/pricing
# (standard tier, <=200K token context, text). Previous values underestimated
# both models — flash-lite output was off by ~3.75x. Still order-of-magnitude
# guard figures, not billing-accurate (priority/flex tiers and the >200K
# token-context rate step are still ignored). Unknown models fall back to
# "default". Re-verify at the next pricing page change.
#
# cached_input   — the discounted rate for the share of an input that Vertex
#                  serves from a context cache. Added 2026-08-20 with the
#                  plumbing that reports the count (trace.record_turn_tokens);
#                  before that the guard had no way to tell a hit from a miss.
# cache_storage_per_hour
#                — USD per 1M cached tokens per WALL-CLOCK HOUR, billed for as
#                  long as the cache exists whether or not anything reads it.
#                  Rates from the Cloud Billing SKU catalogue, 2026-08-20. This
#                  is the line the guard was blind to: on 08-19 it estimated
#                  $2.63 against a $6.12 bill, and the missing $3.49 was ten
#                  abandoned caches sitting on a midnight expiry. Storage is now
#                  charged when the window is granted — see
#                  spend_guard.record_cache_storage.
pricing:
  gemini-3.1-pro-preview:
    input: 2.00
    output: 12.00
    cached_input: 0.20
    cache_storage_per_hour: 4.50
  gemini-3.1-flash-lite:
    input: 0.25
    output: 1.50
    cached_input: 0.025
    cache_storage_per_hour: 1.00
  default:
    input: 2.00
    output: 12.00
    cached_input: 0.20
    cache_storage_per_hour: 4.50

# The VM costs roughly $29/month in fixed infrastructure (~$1/day) regardless of
# usage. That floor is NOT counted here — these thresholds measure AI spend only,
# so a quiet day reads near zero rather than $1.
