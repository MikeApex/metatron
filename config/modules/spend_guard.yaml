# Spend guard — daily runaway protection.
#
# This exists because GCP's own budget data lags by hours, so the $70 soft cap
# and $150 hard cap cannot react at runaway speed. A retry loop can burn a
# month's budget before a budget alert fires. This layer runs in-process and
# reacts in seconds.
#
# Two independent guards, because they fail differently:
#
#   1. Rate limit  — "more than N sessions an hour means something is looping".
#                    Needs no pricing data, so it still works if the rates below
#                    are stale or a new cost source appears. This is the robust one.
#   2. Spend limit — token counts x the rates below. Maps to actual money, so the
#                    thresholds mean something, but depends on the table staying
#                    roughly current.
#
# Accuracy note: these thresholds are for catching order-of-magnitude runaway,
# not for accounting. An estimate that is 2x wrong still catches a 100x loop.

enabled: true

# --- Spend thresholds (USD, per day, estimated from token counts) ---
# Warn, then refuse. The gap is deliberate: a warning that is also a hard stop
# gives no chance to intervene before the system goes silent.
#
# PER HOST. The VM and the Mac both bill the same Vertex project and each keeps
# its own counter — see the header note in core/spend_guard.py. Two hosts means
# the worst-case system ceiling is 2x the stop value below.
#
# Re-baselined 2026-08-08 against Cloud Monitoring rather than against the
# guard's own output, which was the whole problem: thinking tokens were excluded
# from every output count, so the old $5/$10 were denominated in a unit worth
# roughly a third of a real dollar on Pro traffic. Measured Aug 1-8: 20.88M input
# / 1.10M output actual, against 15.89M / 0.30M recorded across both hosts.
#
# The new values are runaway detectors, NOT a budget. Real days measured in that
# window ran ~$2-4/host routine and ~$5-6/host when the A4/B1 suites ran, so an
# alert at 6 stays quiet on a normal heavy day and a stop at 15 is unambiguously
# abnormal. Budget enforcement is the GCP soft/hard caps, which are a different
# mechanism with a different failure mode (see CLAUDE.md - Billing Protection).
alert_usd_per_day: 6.0
stop_usd_per_day: 15.0

# --- Rate limit (pipeline sessions started, rolling 60 minutes) ---
# Normal load is ~7 scheduled sessions/day plus interactive use. These are set
# well above that so ordinary bursts do not trip them.
alert_sessions_per_hour: 20
stop_sessions_per_hour: 60

# --- Pricing, USD per 1M tokens ---
# Verified 2026-08-05 against cloud.google.com/vertex-ai/generative-ai/pricing
# (standard tier, <=200K token context, text). Previous values underestimated
# both models — flash-lite output was off by ~3.75x. Still order-of-magnitude
# guard figures, not billing-accurate (ignores cached-input discounts, priority/
# flex tiers, and the >200K token-context rate step). Unknown models fall back
# to "default". Re-verify at the next pricing page change.
pricing:
  gemini-3.1-pro-preview:
    input: 2.00
    output: 12.00
  gemini-3.1-flash-lite:
    input: 0.25
    output: 1.50
  default:
    input: 2.00
    output: 12.00

# The VM costs roughly $29/month in fixed infrastructure (~$1/day) regardless of
# usage. That floor is NOT counted here — these thresholds measure AI spend only,
# so a quiet day reads near zero rather than $1.
