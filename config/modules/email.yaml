# Email integration (IMAP, read-only) — template.
#
# The live file is per-persona and gitignored, like caldav.yaml:
#   config/personas/{persona}/email.yaml
# This copy is the documented shape and holds no credentials.
#
# Read-only by design. `read_email` never sends and never marks a message as read
# (messages are fetched with BODY.PEEK). Sending is deferred with the rest of the
# act-on-the-user's-behalf work — see the Phase 5 plan, item 5.
#
# Gmail needs TWO things, and the second is the one people miss:
#   1. An app-specific password (Google Account → Security → App passwords).
#      Requires 2-Step Verification to be on. The same app password works for
#      CalDAV and IMAP, so the calendar's password can be reused — though a
#      separate one is better hygiene, since it can be revoked independently.
#   2. IMAP enabled: Gmail → Settings → Forwarding and POP/IMAP → Enable IMAP.
#      A correct password with IMAP switched off fails at login and looks
#      exactly like a wrong password.
#
# Other providers:
#   iCloud   — imap.mail.me.com    (app-specific password required)
#   Fastmail — imap.fastmail.com   (app password)
#   Outlook  — outlook.office365.com

enabled: false

host: "imap.gmail.com"

auth:
  username: "diamond.mike.mt@gmail.com"
  # App-specific password — never the main account password.
  password: ""

# Mailbox read by default. Gmail exposes labels as folders, e.g. "[Gmail]/All Mail".
default_folder: "INBOX"

# ---------------------------------------------------------------------------------
# THIS FILE IS READ BY NOTHING. The live config is per-persona
# (config/personas/{persona}/email.yaml); the file new personas are provisioned from,
# and the one `read_email` falls back to for defaults, is config/templates/email.yaml.
#
# Do not add a setting here expecting it to take effect, and do not mirror one that
# lives in the template — a second copy is how these drift. The neighbouring
# config/modules/caldav.yaml is the worked example: it still documents the
# apidata.googleusercontent.com CalDAV endpoint that config/templates/caldav.yaml
# records as verified-broken on 2026-08-03 (401s on app passwords), because nothing
# reads it and so nothing caught it. See CLAUDE.md § One Home Per Rule Class.
#
# `check_interval_minutes` — how often the mailbox is worth re-reading — is defined in
# config/templates/email.yaml, deliberately not here.
# ---------------------------------------------------------------------------------
