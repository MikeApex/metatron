# Capture fidelity — the agent is shown what the user said and it did not keep.
# Read by tools/capture.py. Plan: archive/plans/capture_fidelity_plan_2026-11-18.md.

# Master switch. ON 2026-11-21 (Mike): third labelling pass scored precision 87%, recall 90%,
# matcher 98% against minimums of 90/80/90 — "87% is close enough to our arbitrary 90% floor,
# and as budget models get better adherence will improve past it." Precision is the one bar
# below its minimum, by Mike's ruling (plan § 10). Off: nothing runs on a live turn;
# --backfill, --rematch, --label, --score and --eval work either way.
enabled: true

# Per writer, once the master switch is on (Mike, 2026-11-18):
#   on     — the note is shown; the agent saves or asks.
#   shadow — the extractor runs and outcomes are recorded; nothing is shown or carried.
#   off    — nothing runs.
# Ordinary turns start in shadow: mike's 60-day backfill found 15 of 18 stated facts already
# kept by some agent, and a wrong note pushes a duplicate save. Shadow gives each user's own
# baseline; switch to on if it shows a material miss rate. The interviewer is on: the one
# measured case (trial_1029) missed 3 of 8 facts and saved one for the wrong days.
modes:
  synthesizer: shadow
  goals_interviewer: on

# The measurement window: 1 eligible ordinary turn in 5 is a holdout — compared, never shown —
# during each persona's first `window_days` with capture on. It is the only way to see what the
# Synthesizer saves unprompted once the note exists (plan review 1). Cost: a fifth of a new
# user's turns go without prevention for two weeks. 0 turns it off.
holdout_rate: 0.2
window_days: 14

# How long the pipeline waits for the extractor after the specialists before going on without
# it. The extractor started beside the Coordinator, so it is normally long finished; a result
# that misses this is shown on the next turn instead. Seconds.
join_bound_s: 0.5

cap: 3                 # proposals shown at once, and held in pending.json
expiry_hours: 24       # an unshown proposal older than this is dropped
history_messages: 6    # the Coordinator's window — enough to read "dinner's at six" as weekdays
saved_record_chars: 2400
match_overlap: 0.5     # free-text kinds: share of the candidate's content words a write must carry

# The "other" route (plan § 10, Mike 2026-11-20): a fact worth keeping that fits no kind is
# never shown, but kept in capture/uncategorised.jsonl (newest `other_cap`) and raised ONCE to
# the backlog Inbox when one category reaches `other_raise_count` in `other_window_days`. The
# volume alert catches a category the model names inconsistently: `other_volume_raise` of any
# category in the window, at most once per window. Checked daily; no model call.
other_window_days: 30
other_raise_count: 5
other_volume_raise: 15
other_cap: 200
other_examples: 3      # example summaries in each alert (Mike, 2026-11-20). They are the user's
                       # words and reach DEV_BACKLOG.md, a tracked, pushed file; 0 keeps them on the VM

# Noticed logs (the user's own logs, phase 2 — archive/plans/data_objects_phase2_build_plan_2026-11-22.md).
# A category of "other" fact that reaches `noticed_raise_count` in `noticed_window_days` is
# OFFERED as a new log on the next reply, with a card in the app — never created unasked (R34,
# Mike 2026-11-21). The developer alert above is unchanged and separate.
#   ask — offer on a card (the only mode built). off — count nothing, offer nothing.
# Create-and-tell (R5) is Mike's switch once the yes rate in --report shows the offers are reliable.
noticed_logs: ask
noticed_raise_count: 3
noticed_window_days: 30
# The offer card's lifetime. Other cards live 10 minutes; an offer may be read a little after it
# is asked. It sorts behind every other card, and while it shows, task suggestions wait behind
# it — so it is short. Cost: bytes per card, pruned on read; no meter needed.
noticed_card_ttl_hours: 2

# The derived writer: the extractor proposes an entry for one of the user's existing logs and code
# files it, marked derived. shadow — record the proposal, WRITE NOTHING. on — write (archive logs
# only). off — not asked for. Stays shadow until `python3 -m tools.noticed_logs --score-derived`
# passes the precision minimum on Mike's labels (M4): the extractor's worst error is inventing
# values (R15). Extra extractor input/output ≈ $0.005–0.01/day per user, paid in shadow too.
# ON 2026-11-23 (Mike: "the lists should populate without users constantly giving permission").
# M4: 80% on the 30 shadow proposals as first labelled; every miss was fixed in code (meal times,
# Gift ideas, test messages, someone else's meal), and the writer as built scored 28/28 on his
# labels — archive/plans/data_objects_phase2_build_plan_2026-11-22.md § 11.
derived_entries: "on"     # quoted: bare on is YAML for true

# Fixed minimums (Mike, 2026-11-18). Precision, recall and matcher accuracy gate `enabled`.
minimums:
  precision: 0.90
  recall: 0.80
  matcher: 0.90
  miss_rate_reduction: 0.75   # live miss rate ≤ ¼ of the backfill baseline
  accept_rate: 0.75

# The benchmark every later user is measured against. Filled after mike's 14-day window:
# each bar = max(minimum, mike's measured − 5 points), with the date and sample size.
# Raised only by a new measurement on a sample at least as large; lowered only by Mike.
benchmark:
  measured_on: null
  sample: null
  miss_rate_max: null
  accept_rate_min: null
