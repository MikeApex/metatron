# Scheduler configuration
#
# Controls when the scheduler daemon fires orchestrator sessions.
# Edit times and intervals here — no code changes needed.
#
# notification channels:
#   terminal  — stdout + macOS notification banner
#   push      — Web Push to registered phone PWA
#   both      — terminal and push
#
# day: vs days: — two different keys that drive two different layers (found 2026-09-03,
# the hard way — see weekly_clinical_review below for the incident). `day:` (singular)
# is read ONCE, at daemon start, by `_register_schedules` in core/scheduler.py — it
# takes the weekly branch and calls `schedule.every().<day>.at(t)`. `days:` (plural) is
# read on EVERY firing attempt, by `_is_active_day`, which compares against
# `strftime("%A").lower()`. Both need a FULL lowercase day name (`sunday`, not `sun`) —
# an abbreviation matches nothing on any day, silently and permanently. A weekly job
# needs `day:` for registration; `days:` is redundant but harmless if spelled the same.
# A daily job needs neither — `time:` alone registers daily and the gate's `days`
# default (`daily`) already passes every day. Full writeup:
# docs/INFRASTRUCTURE.md § Scheduler job config.

quiet_hours:
  start: "22:00"
  end: "07:00"

schedules:
  morning_brief:
    enabled: true
    time: "07:30"
    days: weekdays          # weekdays | daily | weekend
    agent: coordinator
    prompt: "Good morning. Open with whatever is most time-sensitive today — a commitment, an overdue follow-up, or an unresolved thread from recent context. Name it specifically rather than asking a general question. If genuinely nothing is outstanding, keep it to one line and ask what is on."
    notification: both

  companion_checkin:
    enabled: true
    interval_minutes: 180
    days: daily
    agent: coordinator
    # Deliberately light, and this is the baseline every new persona inherits.
    # The previous wording commanded a summary of outstanding work on every
    # firing, which in practice re-raised the same item all day. A check-in is
    # an open door, not a status report. (It also named "Mike" in a template
    # used to provision other people.)
    #
    # The shape of the opening lives in config/agents/synthesizer.md
    # (§ Scheduled session conduct), where it applies to every persona. It was
    # spelled out here too until 2026-08-09 — a fourth copy of the same rule,
    # and the one that would have seeded it into every new persona as though it
    # were their own preference. Do not restate it here.
    prompt: "Check in."
    notification: push
    respect_quiet_hours: true

  evening_close:
    enabled: true
    time: "20:00"
    days: daily
    agent: coordinator
    prompt: "How did today go? Anything worth capturing before the day closes? Reference anything that was left open earlier today rather than asking in the abstract."
    notification: push
    # Day-close = whole-person session. Coordinator routes to Diarist + Mental Wellbeing + Physical Health.

  location_anticipation:
    enabled: true
    time: "10:00"
    days: daily
    agent: coordinator
    # Anticipatory, not reactive: Logistics' horizon-scan item 5 (where the user
    # will be, and what that location makes possible) needs a session that runs
    # without being asked, or it only ever fires when the user happens to raise
    # something adjacent. Preparation is the job; whether the user hears about
    # any of it, and when, is the Synthesizer's positioning call — a run that
    # finds nothing worth raising says nothing.
    prompt: "Anticipatory logistics pass. Review where the user will be this evening and tomorrow and what those locations make possible or leave unarranged — an unplanned mealtime away from home, an errand satisfiable nearby, a downtime gap something nearby could fill. Prepare concrete options where a real gap exists. Surface only what is genuinely worth raising now; if nothing is, say nothing beyond a single line."
    notification: push
    respect_quiet_hours: true

  weekly_pattern_miner:
    enabled: true
    day: sunday             # monday | tuesday | ... | sunday
    time: "09:00"
    agent: pattern_miner
    prompt: "Run a full pattern analysis for this week, the past 30 days, and the past 90 days."
    notification: terminal

  weekly_physical_review:
    enabled: true
    day: sunday
    time: "09:30"
    agent: physical_health
    prompt: "Run a weekly physical health review. Check sleep trends, exercise consistency, medication adherence, and nutrition logging for the past 7 days. Flag any trajectory concerns. Write a summary to the log."
    notification: terminal

  # NOTE — ambient_refresh, daily_rule_audit and daily_calendar_dedup_audit used
  # to be listed here and deliberately are not any more (2026-08-08). They are
  # silent, token-free infrastructure rather than preferences, so they now
  # register for **every** persona from `_DEFAULT_JOBS` in core/scheduler.py.
  #
  # The reason is a real failure, not tidiness: this template is copied **once**,
  # at persona creation, and nothing ever propagated a later change to an
  # existing persona. daily_calendar_dedup_audit shipped 2026-08-05 and had never
  # run for mike three days later — live in the repo, live in this file, inert in
  # production, with nothing reporting the gap.
  #
  # To change one for a single persona, define the same key in that persona's
  # scheduler.yaml — persona config wins outright, including `enabled: false`.

  # Reads the next 24h of calendar, recognises travel (flight numbers, named TfL
  # lines), and checks each against get_flight_status / get_tfl_status. A function
  # job, so a quiet travel day costs no model tokens and sends nothing at all —
  # it notifies ONLY on an actual delay, cancellation or line disruption, and
  # reports each one once. See tools/travel_watch.py for why detection requires
  # two independent signals before it believes a flight number.
  #
  # Function jobs run the full gate stack since 2026-08-28 ([DB-0808-11]) — the
  # old warning that an interval job here could push at 3am no longer applies.
  # `respect_quiet_hours: false` is deliberate and load-bearing: 06:45 sits
  # inside the default 22:00-07:00 quiet window, and without the flag the gate
  # would silently skip this job every single day. Being woken at 06:45 because
  # the morning departure is cancelled is the feature's entire point — it
  # notifies ONLY on an actual delay, cancellation or disruption, so the flag
  # cannot produce a routine 3am push. 06:45 gives time to act.
  daily_travel_check:
    enabled: true
    time: "06:45"
    days: daily
    function: tools.travel_watch.travel_check
    notification: push
    respect_quiet_hours: false

  # [DB-0808-06], 2026-09-03. A tier-2 clinical concern that has sat unreviewed past
  # the dwell in tools/escalation.py is offered for closing — as a confirmation card
  # the user answers, never as an automatic close, because there is no recipient to
  # route it to yet and a timer is not a second opinion.
  #
  # Weekly, and NOT push-notified. The re-offer window inside the function is what
  # actually paces this; the weekly cadence just means a due item waits at most seven
  # days. `notification: none` is the load-bearing setting: an unprompted phone alert
  # about the worst thing in someone's life, arriving on a schedule, is precisely the
  # behaviour the dwell exists to avoid. The card waits until they are in the app.
  #
  # Costs nothing per run — a direct Python call, no model session, on a daemon that
  # is already running; it reads one small JSON file.
  # BOTH day keys are set, and they are not redundant — they drive DIFFERENT layers.
  # Worked out the hard way on 2026-09-03, after this job shipped inert twice:
  #   `day:`  (singular) is read at REGISTRATION — `_register_schedules` calls
  #           `schedule.every().<day>.at(t)`. Without it the job registers DAILY.
  #   `days:` is read by the FIRING GATE — `_is_active_day` compares against
  #           `strftime("%A").lower()`, so it needs the FULL lowercase day name.
  #           This shipped as `sun` first, which matches nothing on any day, ever.
  # The other weekly jobs set only `day:`, which is correct and sufficient: their gate
  # defaults to "daily", but registration only ever invokes them on their day.
  weekly_clinical_review:
    enabled: true
    day: sunday
    days: sunday
    time: "11:00"
    function: tools.escalation.review_clinical_escalations
    notification: none
