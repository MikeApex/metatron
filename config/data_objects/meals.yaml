# A template (R6). Kept in the archive rather than the daily log: the log records only whether
# food was logged (`health.food_logged`), never what was eaten.
id: meals
name: Meals
aliases: [food log, food diary, what I ate]
description: Meals and snacks as eaten, with the time — the one place meals are kept.
store: archive
identity: occurrence
fields: {at: datetime, meal: text, what: text, notes: text}
relevant_agents: [physical_health]
